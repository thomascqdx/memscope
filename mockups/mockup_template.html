<!DOCTYPE html>

<style>

  --c-a:#3b82f6; --c-b:#f59e0b;
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --txt:#0f172a; --sub:#64748b;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(15,23,42,.06)}

#tabnav{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
#tabnav button{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}

main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.tab-page{display:none}
.tab-page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}

.card h3 .sub{font-size:12px;color:var(--sub);font-weight:400;margin-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.tbl-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}

th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

tr.lvl-row.open td:first-child::before{content:'▾ '}

.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin-right:4px;border:1px solid var(--line)}

.tag-b{background:#fffbeb;color:#b45309;border-color:#fde68a}
.tag-lv{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.tag-ih{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.gap-pos{color:var(--red);font-weight:600}
.gap-neg{color:var(--green);font-weight:600}
.muted{color:var(--sub)}
.note{font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.controls input[type=text]{padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px}

.controls select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.chart{width:100%;height:340px}
.chart-tall{height:460px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
.strip{display:flex;gap:2px;align-items:center;margin:3px 0}
.strip .cell{width:22px;height:16px;border-radius:3px;display:inline-block}
.strip .cell.empty{background:#f1f5f9;border:1px dashed #cbd5e1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0}
.legend .lg{display:flex;align-items:center;gap:4px}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.kw-lists{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kw-lists ul{margin:0;padding-left:18px;font-size:13px}

#procOverlay{position:fixed;inset:0;background:rgba(248,250,252,.98);z-index:100;overflow:auto;display:none}
#procOverlay.open{display:block}
#procOverlay .inner{max-width:1400px;margin:0 auto;padding:20px}
.backbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;margin-bottom:12px}
.mdraw{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12.5px;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:8px;overflow:auto;max-height:640px}
.mdview h1{font-size:20px;border-bottom:2px solid var(--line);padding-bottom:6px}
.mdview h2{font-size:17px;margin-top:20px;border-bottom:1px solid var(--line);padding-bottom:4px}
.mdview h3{font-size:15px}
.mdtbl{font-size:13px}
.wake{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-top:10px}
.wake .mid{text-align:center;font-weight:600;padding:8px 16px;background:#eef2ff;border-radius:8px;border:1px solid #c7d2fe;align-self:center}
.wake .box{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px}
.wake .box h5{margin:0 0 6px;font-size:12.5px;color:var(--sub)}
.wake .box ul{margin:0;padding-left:16px}
.wake .box li{margin:3px 0}
select[multiple]{min-width:340px}
.pill{display:inline-block;background:#f1f5f9;border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
ul.findings{margin:0;padding-left:20px}
ul.findings li{margin:5px 0}
</style>

<body>
<header id="topbar">
  <div class="bar-row">
    <h1>静态内存对比分析 <span class="sub">（效果示例 · Mockup）</span></h1>
    <div class="chips">
      <span class="chip chip-a">基线 A：<b id="chipA"></b></span>
      <span class="chip chip-b">对比 B：<b id="chipB"></b></span>
    </div>
    <div class="metric-toggle">
      <span>指标：</span>
      <button class="seg active" data-m="pss">PSS</button><button class="seg" data-m="rss">RSS</button>
    </div>
  </div>
  <nav id="tabnav"></nav>
</header>
<main id="main">
  <section class="tab-page" id="page-overview"></section>
  <section class="tab-page" id="page-system"></section>
  <section class="tab-page" id="page-levels"></section>
  <section class="tab-page" id="page-procs"></section>
  <section class="tab-page" id="page-inhouse"></section>
  <section class="tab-page" id="page-events"></section>
  <section class="tab-page" id="page-report"></section>
</main>
<div id="procOverlay"><div class="inner" id="procInner"></div></div>

<script>//__ECHARTS_INLINE//</script>
<script>const PROTO = /*__PROTO_JSON__*/null;</script>
<script>
'use strict';
/* ============ 基础 ============ */
const LA = PROTO.labels[0], LB = PROTO.labels[1];
const INFO = PROTO.info;
let metric = 'pss';
const label = i => PROTO.labels[i];
const N = i => PROTO[metric][label(i)].N;
const ds = i => PROTO[metric][label(i)];
const TAIL_FIELDS = ['Total RAM','Free RAM','cached pss','cached kernel','free','Used RAM','used pss','kernel','Lost RAM','ZRAM physical','in swap','DMA-BUF','GPU'];
const PROC_FIELDS = ['MemTotal','MemFree','MemAvailable','Cached','AnonPages','Mapped','Shmem','Slab','SReclaimable','SUnreclaim','KernelStack','PageTables','VmallocUsed','SwapUsed','SwapCached','CmaFree'];
const REVERSED = new Set(['Free RAM','MemAvailable','MemFree']);
const INHOUSE_PREFIX = ['com.transsion.','com.rlk.','tech.palm.','com.sh.smart.','com.transsnet.','com.scorpio.','com.geniex.','com.idea.','com.xui.','com.tran.'];
const isInhouse = p => INHOUSE_PREFIX.some(x => p.startsWith(x));
const INHOUSE_NOTE = '<div class="note">自研应用判定 — 示例规则：按包名前缀匹配（' + INHOUSE_PREFIX.join(' ') + '），正式版将使用自研白名单。</div>';
const LEVEL_COLORS = {'Native':'#64748b','System':'#0ea5e9','Persistent':'#8b5cf6','Persistent Service':'#a78bfa','Foreground':'#22c55e','Visible':'#84cc16','Perceptible':'#eab308','Perceptible Low':'#f97316','A Services':'#ec4899','B Services':'#14b8a6','Cached':'#94a3b8','Previous':'#78716c'};
const PROC_PALETTE = ['#0ea5e9','#e11d48','#8b5cf6','#16a34a','#f97316','#0891b2','#be185d','#65a30d','#7c3aed','#b45309'];
function lvColor(l){ return LEVEL_COLORS[l] || '#475569'; }

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = v => v==null ? '—' : (+v).toFixed(2);
const fmtInt = v => v==null ? '—' : String(v);
const cnt = v => v.reduce((s,x)=>s+(x!=null?1:0),0);
const rmean = (v,n) => v.reduce((s,x)=>s+(x||0),0)/n;
const vmean = v => { const a=v.filter(x=>x!=null); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const vmin = v => { const a=v.filter(x=>x!=null); return a.length ? Math.min(...a) : null; };
const vmax = v => { const a=v.filter(x=>x!=null); return a.length ? Math.max(...a) : null; };
function gapInfo(a,b){
  const gap = b - a;
  if (a===0 && b===0) return {gap, txt:'—', cls:''};
  if (a===0) return {gap, txt:'新增', cls:'gap-pos'};
  if (b===0) return {gap, txt:'消失', cls:'gap-neg'};
  return {gap, pct:gap/a*100, txt:(gap/a*100).toFixed(1)+'%', cls:''};
}
function gapCls(gap, reversed){
  if (gap==null || gap===0) return '';
  const worse = reversed ? gap<0 : gap>0;
  return worse ? 'gap-pos' : 'gap-neg';
}
function gapCells(a, b, reversed){
  const g = gapInfo(a,b);
  const cls = g.cls || gapCls(g.gap, reversed);
  return '<td class="num '+cls+'">'+fmt(g.gap)+'</td><td class="num '+cls+'">'+esc(g.txt)+'</td>';
}
const LIVE_CHARTS = new Set();
function makeChart(el){
  const old = echarts.getInstanceByDom(el);
  if (old) old.dispose();
  const ch = echarts.init(el);
  LIVE_CHARTS.add(ch);
  requestAnimationFrame(()=>ch.resize());
  return ch;
}
window.addEventListener('resize', ()=>LIVE_CHARTS.forEach(c=>c.resize()));
const roundCats = n => Array.from({length:n},(_,i)=>'第'+(i+1)+'轮');

/* ============ 数据派生 ============ */
let procMaps = null;
function getProcMaps(){
  if (procMaps) return procMaps;
  procMaps = [0,1].map(i=>{
    const D = ds(i), m = {};
    for (const key in D.procs){
      const j = key.indexOf('|'), lv = key.slice(0,j), p = key.slice(j+1);
      const vals = D.procs[key];
      const e = m[p] || (m[p] = {levels:{}, total:new Array(D.N).fill(null)});
      e.levels[lv] = vals;
      for (let r=0;r<vals.length;r++) if (vals[r]!=null) e.total[r] = (e.total[r]||0)+vals[r];
    }
    return m;
  });
  return procMaps;
}
function allLevels(){
  const out=[], seen=new Set();
  [0,1].forEach(i=>{ for (const k in ds(i).levels) if(!seen.has(k)){seen.add(k);out.push(k);} });
  return out;
}
const levelVals = (i,L) => ds(i).levels[L] || new Array(N(i)).fill(null);
function procLevelSet(i,p){
  const e = getProcMaps()[i][p];
  return e ? new Set(Object.keys(e.levels)) : new Set();
}
function levelAt(i,p,r){
  const e = getProcMaps()[i][p];
  if (!e) return null;
  for (const lv in e.levels) if (e.levels[lv][r]!=null) return lv;
  return null;
}
function procTotal(i,p){ // array per round or null
  const e = getProcMaps()[i][p];
  return e ? e.total : new Array(N(i)).fill(null);
}
function procLevelSeries(i,p,lv){
  const e = getProcMaps()[i][p];
  return (e && e.levels[lv]) || new Array(N(i)).fill(null);
}
function tags(p){
  const inA = !!getProcMaps()[0][p], inB = !!getProcMaps()[1][p];
  const t = [];
  if (inA && !inB) t.push('<span class="tag tag-a">仅A</span>');
  if (!inA && inB) t.push('<span class="tag tag-b">仅B</span>');
  const sa=procLevelSet(0,p), sb=procLevelSet(1,p);
  const diff = sa.size!==sb.size || [...sa].some(x=>!sb.has(x));
  if (inA && inB && (diff || sa.size>1 || sb.size>1)) t.push('<span class="tag tag-lv">层级变化</span>');
  if (isInhouse(p)) t.push('<span class="tag tag-ih">自研</span>');
  return t.join('');
}
function allProcNames(){
  const s = new Set();
  getProcMaps().forEach(m=>Object.keys(m).forEach(p=>s.add(p)));
  return [...s];
}
function procGapRows(){ // union of procs with total stats
  return allProcNames().map(p=>{
    const ta=procTotal(0,p), tb=procTotal(1,p);
    const ra=rmean(ta,N(0)), rb=rmean(tb,N(1));
    return {p, ta, tb, ra, rb, gap:rb-ra, ka:cnt(ta), kb:cnt(tb), va:vmean(ta), vb:vmean(tb)};
  });
}
function tailSeries(i,f){ return PROTO.tail[label(i)].map(r=>r[f]); }
function memSeries(i,f){
  return PROTO.proc[label(i)].map(r=>{
    if (f==='SwapUsed') return (r['SwapTotal']!=null && r['SwapFree']!=null) ? r['SwapTotal']-r['SwapFree'] : null;
    return r[f]!==undefined ? r[f] : null;
  });
}
function firstRound(i){ return new Date(INFO[i].rounds_time[0].replace(' ','T')); }
function evTime(i,e){ return new Date(INFO[i].rounds_time[0].slice(0,4)+'-'+e.t.replace(' ','T')); }
function evInWindow(i,e){ return evTime(i,e) >= firstRound(i); }

/* ============ 路由 ============ */
const PAGES = {overview:'概览', system:'整机内存', levels:'层级内存', procs:'进程分析', inhouse:'自研应用', events:'启动/唤醒分析', report:'Markdown 报告'};
const state = {tab:'overview', evQ:'', lvHideCached:false, lvGapMin:0, pkKw:'', pkLevel:'', pkInhouse:false, pkGapMin:0, sysSel:null, trSel:null, mdRaw:false, expanded:new Set(), lvInit:false};
function parseHash(){
  const h = location.hash.replace(/^#/,'');
  const q = new URLSearchParams(h);
  return {tab:q.get('tab'), proc:q.get('proc'), q:q.get('q')};
}
function route(){
  const p = parseHash();
  if (p.proc){ openProc(p.proc); return; }
  document.getElementById('procOverlay').classList.remove('open');
  const tab = (p.tab && PAGES[p.tab]) ? p.tab : 'overview';
  state.tab = tab;
  if (tab==='events' && p.q!=null) state.evQ = p.q;
  document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-page').forEach(s=>s.classList.toggle('active', s.id==='page-'+tab));
  RENDER[tab]();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
const nav = document.getElementById('tabnav');
for (const id in PAGES){
  const b = document.createElement('button');
  b.textContent = PAGES[id]; b.dataset.tab = id;
  b.onclick = ()=>{ location.hash = 'tab='+id; };
  nav.appendChild(b);
}
document.getElementById('chipA').textContent = LA;
document.getElementById('chipB').textContent = LB;
document.querySelectorAll('.metric-toggle .seg').forEach(b=>{
  b.onclick = ()=>{
    if (b.dataset.m===metric) return;
    metric = b.dataset.m; procMaps = null;
    document.querySelectorAll('.metric-toggle .seg').forEach(x=>x.classList.toggle('active', x===b));
    if (document.getElementById('procOverlay').classList.contains('open')){
      const p = parseHash(); if (p.proc) openProc(p.proc);
    } else RENDER[state.tab]();
  };
});

/* ============ 1. 概览 ============ */
function infoRows(){
  const keys = Object.keys(INFO[0]).filter(k=>!['packages','rounds_time','events'].includes(k));
  const rows = keys.map(k=>({k, a:INFO[0][k], b:INFO[1][k]}));
  const rt = i => INFO[i].rounds_time;
  const span = i => rt(i)[0] + ' ~ ' + rt(i)[rt(i).length-1];
  const interval = i => {
    const ts = rt(i).map(s=>new Date(s.replace(' ','T')).getTime());
    let d=0; for(let r=1;r<ts.length;r++) d+=ts[r]-ts[r-1];
    return (d/(ts.length-1)/60000).toFixed(1)+' 分钟';
  };
  rows.push({k:'采集轮次', a:String(N(0)), b:String(N(1))});
  rows.push({k:'测试时间范围', a:span(0), b:span(1)});
  rows.push({k:'平均采样间隔', a:interval(0), b:interval(1)});
  return rows;
}
function kpiDefs(){
  return [
    {t:'Free RAM', f:i=>tailSeries(i,'Free RAM'), src:'dumpsys meminfo'},
    {t:'Used RAM', f:i=>tailSeries(i,'Used RAM'), src:'dumpsys meminfo'},
    {t:'used pss', f:i=>tailSeries(i,'used pss'), src:'dumpsys meminfo'},
    {t:'kernel', f:i=>tailSeries(i,'kernel'), src:'dumpsys meminfo'},
    {t:'MemAvailable', f:i=>memSeries(i,'MemAvailable'), src:'/proc/meminfo'},
    {t:'ZRAM physical', f:i=>tailSeries(i,'ZRAM physical'), src:'dumpsys meminfo'},
    {t:'in swap', f:i=>tailSeries(i,'in swap'), src:'dumpsys meminfo'},
    {t:'Lost RAM', f:i=>tailSeries(i,'Lost RAM'), src:'dumpsys meminfo'},
  ];
}
function levelGapRows(){
  return allLevels().map(L=>{
    const ra=rmean(levelVals(0,L),N(0)), rb=rmean(levelVals(1,L),N(1));
    return {L, ra, rb, gap:rb-ra};
  });
}
function levelChangedProcs(){
  const out=[];
  for (const p of allProcNames()){
    const sa=procLevelSet(0,p), sb=procLevelSet(1,p);
    if (!sa.size || !sb.size) continue; // 单数据集进程归入“独有进程”，不算层级变化
    const diff = sa.size!==sb.size || [...sa].some(x=>!sb.has(x));
    if (diff || sa.size>1 || sb.size>1) out.push(p);
  }
  return out;
}
function findings(){
  const out=[];
  const lg = levelGapRows().filter(r=>r.L!=='Cached').sort((x,y)=>Math.abs(y.gap)-Math.abs(x.gap)).slice(0,3);
  out.push('层级 GAP Top3（不含 Cached）：' + lg.map(r=>esc(r.L)+' <b class="'+gapCls(r.gap)+'">'+(r.gap>0?'+':'')+fmt(r.gap)+' MB</b>').join('，'));
  const pg = procGapRows().sort((x,y)=>Math.abs(y.gap)-Math.abs(x.gap)).slice(0,5);
  out.push('进程 GAP Top5（按进程合计轮次均值）：' + pg.map(r=>'<a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a> <b class="'+gapCls(r.gap)+'">'+(r.gap>0?'+':'')+fmt(r.gap)+' MB</b>').join('，'));
  const rows = procGapRows();
  const onlyA = rows.filter(r=>r.ka>0&&r.kb===0).length, onlyB = rows.filter(r=>r.kb>0&&r.ka===0).length;
  out.push('独有进程：仅 A 出现 <b>'+onlyA+'</b> 个，仅 B 出现 <b>'+onlyB+'</b> 个；发生层级变化的进程 <b>'+levelChangedProcs().length+'</b> 个。');
  const dm = gapInfo(rmean(tailSeries(0,'DMA-BUF'),N(0)), rmean(tailSeries(1,'DMA-BUF'),N(1)));
  const gp = gapInfo(rmean(tailSeries(0,'GPU'),N(0)), rmean(tailSeries(1,'GPU'),N(1)));
  out.push('DMA-BUF 均值变化 <b class="'+gapCls(dm.gap)+'">'+(dm.gap>0?'+':'')+fmt(dm.gap)+' MB</b>，GPU 均值变化 <b class="'+gapCls(gp.gap)+'">'+(gp.gap>0?'+':'')+fmt(gp.gap)+' MB</b>。');
  return out;
}
const RENDER = {};
function renderOverview(){
  const el = document.getElementById('page-overview');
  const pkgA = new Set(INFO[0].packages), pkgB = new Set(INFO[1].packages);
  const onlyApk = [...pkgA].filter(x=>!pkgB.has(x)).sort();
  const onlyBpk = [...pkgB].filter(x=>!pkgA.has(x)).sort();
  let h = '<div class="card"><h3>设备信息对比 <span class="sub">差异行高亮</span></h3><div class="tbl-wrap"><table><thead><tr><th>字段</th><th>基线 A</th><th>对比 B</th></tr></thead><tbody>';
  infoRows().forEach(r=>{
    const diff = r.a!==r.b;
    h += '<tr'+(diff?' class="diff"':'')+'><td>'+esc(r.k)+'</td><td>'+esc(r.a)+'</td><td>'+esc(r.b)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '<div class="card"><h3>KPI 指标（轮次均值，MB）<span class="sub">红色=变差，绿色=改善；Free RAM/MemAvailable 方向相反</span></h3><div class="grid-kpi">';
  kpiDefs().forEach(d=>{
    const ra=rmean(d.f(0),N(0)), rb=rmean(d.f(1),N(1));
    const g=gapInfo(ra,rb), cls=g.cls||gapCls(g.gap, REVERSED.has(d.t));
    h += '<div class="kpi"><div class="t">'+esc(d.t)+' <span class="src">'+esc(d.src)+'</span></div>'
      +'<div class="v"><span style="color:var(--c-a)">A '+fmt(ra)+'</span><span style="color:var(--c-b)">B '+fmt(rb)+'</span></div>'
      +'<div class="gap '+cls+'">GAP '+(g.gap>0?'+':'')+fmt(g.gap)+'（'+esc(g.txt)+'）</div></div>';
  });
  h += '</div></div>';
  h += '<div class="card"><h3>预装包差异 <span class="sub">A '+pkgA.size+' 个 / B '+pkgB.size+' 个</span></h3><div class="kw-lists">'
    +'<div><b>仅 A（'+onlyApk.length+'）</b><ul>'+(onlyApk.map(x=>'<li class="mono">'+esc(x)+'</li>').join('')||'<li class="muted">无</li>')+'</ul></div>'
    +'<div><b>仅 B（'+onlyBpk.length+'）</b><ul>'+(onlyBpk.map(x=>'<li class="mono">'+esc(x)+'</li>').join('')||'<li class="muted">无</li>')+'</ul></div>'
    +'</div></div>';
  h += '<div class="card"><h3>自动发现 <span class="sub">基于 '+metric.toUpperCase()+' 轮次均值</span></h3><ul class="findings">'
    + findings().map(x=>'<li>'+x+'</li>').join('') + '</ul></div>';
  el.innerHTML = h;
}
RENDER.overview = renderOverview;

/* ============ 2. 整机内存 ============ */
function sysMetricDefs(){
  const defs = TAIL_FIELDS.map(f=>({t:f, src:'dumpsys meminfo', f:i=>tailSeries(i,f)}));
  PROC_FIELDS.forEach(f=>defs.push({t:f, src:'/proc/meminfo', f:i=>memSeries(i,f)}));
  return defs;
}
function renderSystem(){
  const el = document.getElementById('page-system');
  const defs = sysMetricDefs();
  if (!state.sysSel) state.sysSel = ['Free RAM','MemAvailable','in swap'];
  let h = '<div class="card"><h3>整机内存指标 <span class="sub">轮次均值 / MB</span></h3><div class="tbl-wrap"><table><thead><tr>'
    +'<th>指标</th><th>来源</th><th class="num">A 均值</th><th class="num">B 均值</th><th class="num">GAP</th><th class="num">GAP%</th>'
    +'<th class="num">A 最小</th><th class="num">A 最大</th><th class="num">B 最小</th><th class="num">B 最大</th></tr></thead><tbody>';
  defs.forEach(d=>{
    const a=d.f(0), b=d.f(1), ra=rmean(a,N(0)), rb=rmean(b,N(1));
    h += '<tr><td>'+esc(d.t)+'</td><td class="muted">'+esc(d.src)+'</td><td class="num">'+fmt(ra)+'</td><td class="num">'+fmt(rb)+'</td>'
      + gapCells(ra,rb,REVERSED.has(d.t))
      + '<td class="num">'+fmt(vmin(a))+'</td><td class="num">'+fmt(vmax(a))+'</td><td class="num">'+fmt(vmin(b))+'</td><td class="num">'+fmt(vmax(b))+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '<div class="card"><h3>逐轮走势 <span class="sub">按住 Ctrl 多选指标；实线=A，虚线=B</span></h3>'
    +'<div class="controls"><select id="sysSel" multiple size="6">'
    + defs.map(d=>'<option'+(state.sysSel.includes(d.t)?' selected':'')+'>'+esc(d.t)+'</option>').join('')
    +'</select></div><div id="sysChart" class="chart chart-tall"></div></div>';
  el.innerHTML = h;
  const sel = document.getElementById('sysSel');
  const draw = ()=>{
    state.sysSel = [...sel.selectedOptions].map(o=>o.value);
    const series=[];
    state.sysSel.forEach((t,idx)=>{
      const d = defs.find(x=>x.t===t); if(!d) return;
      const col = PROC_PALETTE[idx%PROC_PALETTE.length];
      series.push({name:t+' · A', type:'line', data:d.f(0), itemStyle:{color:col}, lineStyle:{type:'solid',color:col}, symbolSize:5});
      series.push({name:t+' · B', type:'line', data:d.f(1), itemStyle:{color:col}, lineStyle:{type:'dashed',color:col}, symbolSize:5});
    });
    makeChart(document.getElementById('sysChart')).setOption({
      tooltip:{trigger:'axis'}, legend:{type:'scroll',top:0},
      grid:{top:40,left:60,right:20,bottom:30},
      xAxis:{type:'category',data:roundCats(Math.max(N(0),N(1)))},
      yAxis:{type:'value',name:'MB'}, series
    });
  };
  sel.onchange = draw; draw();
}
RENDER.system = renderSystem;

/* ============ 3. 层级内存 ============ */
function renderLevels(){
  const el = document.getElementById('page-levels');
  const levels = allLevels();
  if (!state.lvInit){ // 默认展开 |GAP| 最大的层级，便于演示
    state.lvInit = true;
    let best=null,bg=-1;
    levels.forEach(L=>{const g=Math.abs(rmean(levelVals(1,L),N(1))-rmean(levelVals(0,L),N(0)));if(g>bg){bg=g;best=L;}});
    if (best) state.expanded.add(best);
  }
  let h = INHOUSE_NOTE;
  h += '<div class="card"><h3>层级内存对比（'+metric.toUpperCase()+' 轮次均值，MB）</h3><div id="lvChart" class="chart"></div></div>';
  h += '<div class="card"><h3>层级 / 进程明细 <span class="sub">点击层级行展开进程；点击进程名查看详情</span></h3>'
    +'<div class="controls"><label><input type="checkbox" id="lvHideCached"'+(state.lvHideCached?' checked':'')+'> 隐藏 Cached</label>'
    +'<label>GAP 阈值(MB) <input type="number" id="lvGapMin" min="0" step="1" value="'+state.lvGapMin+'"></label></div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>层级 / 进程</th><th class="num">出现 A</th><th class="num">出现 B</th><th class="num">轮均 A</th><th class="num">轮均 B</th><th class="num">值均 A</th><th class="num">值均 B</th><th class="num">GAP</th><th class="num">GAP%</th><th class="num">进程数 A/B</th><th>标签</th></tr></thead><tbody id="lvBody"></tbody></table></div></div>';
  el.innerHTML = h;
  makeChart(document.getElementById('lvChart')).setOption({
    tooltip:{trigger:'axis'}, legend:{top:0},
    grid:{top:36,left:60,right:20,bottom:60},
    xAxis:{type:'category',data:levels,axisLabel:{rotate:30}},
    yAxis:{type:'value',name:'MB'},
    series:[
      {name:'A '+LA, type:'bar', data:levels.map(L=>+rmean(levelVals(0,L),N(0)).toFixed(2)), itemStyle:{color:'#3b82f6'}},
      {name:'B '+LB, type:'bar', data:levels.map(L=>+rmean(levelVals(1,L),N(1)).toFixed(2)), itemStyle:{color:'#f59e0b'}}
    ]
  });
  const body = document.getElementById('lvBody');
  const fill = ()=>{
    const maps = getProcMaps();
    let rows='';
    levels.forEach(L=>{
      if (state.lvHideCached && L==='Cached') return;
      const ra=rmean(levelVals(0,L),N(0)), rb=rmean(levelVals(1,L),N(1));
      const ca=Object.keys(maps[0]).filter(p=>maps[0][p].levels[L]&&cnt(maps[0][p].levels[L])>0).length;
      const cb=Object.keys(maps[1]).filter(p=>maps[1][p].levels[L]&&cnt(maps[1][p].levels[L])>0).length;
      const open = state.expanded.has(L);
      rows += '<tr class="lvl-row'+(open?' open':'')+'" data-lv="'+esc(L)+'"><td>'+esc(L)+'</td><td class="num"></td><td class="num"></td><td class="num">'+fmt(ra)+'</td><td class="num">'+fmt(rb)+'</td><td class="num"></td><td class="num"></td>'
        + gapCells(ra,rb) + '<td class="num">'+ca+' / '+cb+'</td><td></td></tr>';
      if (open){
        const ps = new Set();
        [0,1].forEach(i=>Object.keys(maps[i]).forEach(p=>{ if(maps[i][p].levels[L] && cnt(maps[i][p].levels[L])>0) ps.add(p); }));
        const prows = [...ps].map(p=>{
          const va=procLevelSeries(0,p,L), vb=procLevelSeries(1,p,L);
          const ra2=rmean(va,N(0)), rb2=rmean(vb,N(1));
          return {p, ka:cnt(va), kb:cnt(vb), ra:ra2, rb:rb2, va:vmean(va), vb:vmean(vb), gap:rb2-ra2};
        }).filter(r=>Math.abs(r.gap)>=state.lvGapMin).sort((x,y)=>Math.abs(y.gap)-Math.abs(x.gap));
        prows.forEach(r=>{
          rows += '<tr class="proc-row"><td><a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a></td>'
            +'<td class="num">'+r.ka+'/'+N(0)+'</td><td class="num">'+r.kb+'/'+N(1)+'</td>'
            +'<td class="num">'+fmt(r.ra)+'</td><td class="num">'+fmt(r.rb)+'</td>'
            +'<td class="num">'+fmt(r.va)+'</td><td class="num">'+fmt(r.vb)+'</td>'
            + gapCells(r.ra,r.rb) + '<td></td><td>'+tags(r.p)+'</td></tr>';
        });
      }
    });
    body.innerHTML = rows;
    body.querySelectorAll('tr.lvl-row').forEach(tr=>{
      tr.onclick = ()=>{
        const L = tr.dataset.lv;
        state.expanded.has(L) ? state.expanded.delete(L) : state.expanded.add(L);
        fill();
      };
    });
  };
  document.getElementById('lvHideCached').onchange = e=>{ state.lvHideCached=e.target.checked; fill(); };
  document.getElementById('lvGapMin').oninput = e=>{ state.lvGapMin=+e.target.value||0; fill(); };
  fill();
}
RENDER.levels = renderLevels;

/* ============ 4. 进程分析 ============ */
function stripHtml(i,p){
  const n=N(i); let s='<div class="strip">';
  for(let r=0;r<n;r++){
    const lv=levelAt(i,p,r);
    s += lv ? '<span class="cell" style="background:'+lvColor(lv)+'" title="第'+(r+1)+'轮 '+esc(lv)+'"></span>'
            : '<span class="cell empty" title="第'+(r+1)+'轮 未出现"></span>';
  }
  return s+'</div>';
}
function renderProcs(){
  const el = document.getElementById('page-procs');
  const rows = procGapRows();
  const top20 = [...rows].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,20);
  const onlyA = rows.filter(r=>r.ka>0&&r.kb===0), onlyB = rows.filter(r=>r.kb>0&&r.ka===0);
  const changed = levelChangedProcs();
  let h = INHOUSE_NOTE;
  // (a) top20 diverging
  h += '<div class="card"><h3>GAP Top 20 <span class="sub">按进程合计轮次均值（'+metric.toUpperCase()+'），红=增加 绿=减少</span></h3>'
    +'<div id="topChart" class="chart chart-tall"></div>'
    +'<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>进程</th><th class="num">轮均 A</th><th class="num">轮均 B</th><th class="num">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody>'
    + top20.map(r=>'<tr><td><a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a></td><td class="num">'+fmt(r.ra)+'</td><td class="num">'+fmt(r.rb)+'</td>'+gapCells(r.ra,r.rb)+'<td>'+tags(r.p)+'</td></tr>').join('')
    +'</tbody></table></div></div>';
  // (b) unique
  const utab = (list,i)=>'<div class="tbl-wrap" style="max-height:320px"><table><thead><tr><th>进程</th><th>所在层级</th><th class="num">出现次数</th><th class="num">数值均值</th><th class="num">轮次均值</th></tr></thead><tbody>'
    + list.map(r=>'<tr><td><a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a></td><td>'+esc([...procLevelSet(i,r.p)].join('、'))+'</td><td class="num">'+(i?r.kb:r.ka)+'/'+N(i)+'</td><td class="num">'+fmt(i?r.vb:r.va)+'</td><td class="num">'+fmt(i?r.rb:r.ra)+'</td></tr>').join('')
    +'</tbody></table></div>';
  h += '<div class="card"><h3>独有进程</h3><div class="grid2"><div><b>仅 A 出现（'+onlyA.length+'）</b>'+utab(onlyA,0)+'</div><div><b>仅 B 出现（'+onlyB.length+'）</b>'+utab(onlyB,1)+'</div></div></div>';
  // (c) level changed strips
  const lvUsed = new Set(); changed.forEach(p=>{procLevelSet(0,p).forEach(x=>lvUsed.add(x));procLevelSet(1,p).forEach(x=>lvUsed.add(x));});
  h += '<div class="card"><h3>层级变化进程（'+changed.length+'）<span class="sub">每格一轮：A/B 各一条，空=未出现</span></h3>'
    +'<div class="legend">'+[...lvUsed].map(L=>'<span class="lg"><span class="sw" style="background:'+lvColor(L)+'"></span>'+esc(L)+'</span>').join('')+'<span class="lg"><span class="sw" style="background:#f1f5f9;border:1px dashed #cbd5e1"></span>未出现</span></div>'
    +'<div class="tbl-wrap"><table><thead><tr><th style="min-width:260px">进程</th><th>A 各轮层级</th><th>B 各轮层级</th><th>标签</th></tr></thead><tbody>'
    + changed.map(p=>'<tr><td><a href="#proc='+encodeURIComponent(p)+'">'+esc(p)+'</a></td><td>'+stripHtml(0,p)+'</td><td>'+stripHtml(1,p)+'</td><td>'+tags(p)+'</td></tr>').join('')
    +'</tbody></table></div></div>';
  // (d) full table
  h += '<div class="card"><h3>全量进程表（'+rows.length+'）</h3>'
    +'<div class="controls"><input type="text" id="pkKw" placeholder="关键词，多个用逗号分隔" value="'+esc(state.pkKw)+'" style="width:240px">'
    +'<select id="pkLevel"><option value="">全部层级</option>'+allLevels().map(L=>'<option'+(state.pkLevel===L?' selected':'')+'>'+esc(L)+'</option>').join('')+'</select>'
    +'<label><input type="checkbox" id="pkInhouse"'+(state.pkInhouse?' checked':'')+'> 仅自研</label>'
    +'<label>|GAP| ≥ <input type="number" id="pkGapMin" min="0" step="1" value="'+state.pkGapMin+'"> MB</label></div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>进程</th><th>层级 A</th><th>层级 B</th><th class="num">出现 A</th><th class="num">出现 B</th><th class="num">轮均 A</th><th class="num">轮均 B</th><th class="num">值均 A</th><th class="num">值均 B</th><th class="num">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody id="pkBody"></tbody></table></div></div>';
  // (e) trend
  h += '<div class="card"><h3>逐轮走势对比 <span class="sub">默认 |GAP| Top5；实线=A 虚线=B</span></h3>'
    +'<div class="controls"><select id="trSel" multiple size="7">'+[...allProcNames()].sort().map(p=>'<option'+(state.trSel&&state.trSel.includes(p)?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></div>'
    +'<div id="trChart" class="chart chart-tall"></div></div>';
  el.innerHTML = h;
  // top20 chart (diverging)
  const t20 = [...top20].sort((a,b)=>a.gap-b.gap);
  makeChart(document.getElementById('topChart')).setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>{const r=t20[ps[0].dataIndex];return esc(r.p)+'<br>GAP '+fmt(r.gap)+' MB<br>A '+fmt(r.ra)+' / B '+fmt(r.rb);}},
    grid:{top:10,left:10,right:60,bottom:20,containLabel:true},
    xAxis:{type:'value',name:'MB'},
    yAxis:{type:'category',data:t20.map(r=>r.p),axisLabel:{fontSize:11}},
    series:[{type:'bar',data:t20.map(r=>({value:+r.gap.toFixed(2),itemStyle:{color:r.gap>0?'#dc2626':'#16a34a'}})),label:{show:true,position:'right',formatter:p=>fmt(p.value)}}]
  });
  // (d) body fill
  const pkBody = document.getElementById('pkBody');
  const fillPk = ()=>{
    const kws = state.pkKw.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    const list = rows.filter(r=>{
      if (kws.length && !kws.some(k=>r.p.includes(k))) return false;
      if (state.pkLevel && !procLevelSet(0,r.p).has(state.pkLevel) && !procLevelSet(1,r.p).has(state.pkLevel)) return false;
      if (state.pkInhouse && !isInhouse(r.p)) return false;
      if (Math.abs(r.gap) < state.pkGapMin) return false;
      return true;
    }).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
    pkBody.innerHTML = list.map(r=>'<tr><td><a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a></td>'
      +'<td>'+esc([...procLevelSet(0,r.p)].join('、')||'—')+'</td><td>'+esc([...procLevelSet(1,r.p)].join('、')||'—')+'</td>'
      +'<td class="num">'+r.ka+'/'+N(0)+'</td><td class="num">'+r.kb+'/'+N(1)+'</td>'
      +'<td class="num">'+fmt(r.ra)+'</td><td class="num">'+fmt(r.rb)+'</td><td class="num">'+fmt(r.va)+'</td><td class="num">'+fmt(r.vb)+'</td>'
      + gapCells(r.ra,r.rb) + '<td>'+tags(r.p)+'</td></tr>').join('');
  };
  document.getElementById('pkKw').oninput = e=>{state.pkKw=e.target.value;fillPk();};
  document.getElementById('pkLevel').onchange = e=>{state.pkLevel=e.target.value;fillPk();};
  document.getElementById('pkInhouse').onchange = e=>{state.pkInhouse=e.target.checked;fillPk();};
  document.getElementById('pkGapMin').oninput = e=>{state.pkGapMin=+e.target.value||0;fillPk();};
  fillPk();
  // (e) trend chart
  const trSel = document.getElementById('trSel');
  if (!state.trSel) state.trSel = [...rows].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,5).map(r=>r.p);
  [...trSel.options].forEach(o=>{ o.selected = state.trSel.includes(o.value); });
  const drawTr = ()=>{
    state.trSel = [...trSel.selectedOptions].map(o=>o.value);
    const series=[];
    state.trSel.forEach((p,idx)=>{
      const col = PROC_PALETTE[idx%PROC_PALETTE.length];
      series.push({name:p+' · A',type:'line',data:procTotal(0,p),itemStyle:{color:col},lineStyle:{color:col},symbolSize:5,connectNulls:false});
      series.push({name:p+' · B',type:'line',data:procTotal(1,p),itemStyle:{color:col},lineStyle:{color:col,type:'dashed'},symbolSize:5,connectNulls:false});
    });
    makeChart(document.getElementById('trChart')).setOption({
      tooltip:{trigger:'axis'}, legend:{type:'scroll',top:0},
      grid:{top:40,left:60,right:20,bottom:30},
      xAxis:{type:'category',data:roundCats(Math.max(N(0),N(1)))},
      yAxis:{type:'value',name:'MB'}, series
    });
  };
  trSel.onchange = drawTr; drawTr();
}
RENDER.procs = renderProcs;

/* ============ 5. 自研应用 ============ */
function renderInhouse(){
  const el = document.getElementById('page-inhouse');
  const rows = procGapRows().filter(r=>isInhouse(r.p));
  const nA = rows.filter(r=>r.ka>0).length, nB = rows.filter(r=>r.kb>0).length;
  const sumA = rows.reduce((s,r)=>s+r.ra,0), sumB = rows.reduce((s,r)=>s+r.rb,0);
  const g = gapInfo(sumA,sumB);
  let h = INHOUSE_NOTE;
  h += '<div class="grid-kpi">'
    +'<div class="kpi"><div class="t">自研进程数</div><div class="v"><span style="color:var(--c-a)">A '+nA+'</span><span style="color:var(--c-b)">B '+nB+'</span></div><div class="gap '+(nB>nA?'gap-pos':nB<nA?'gap-neg':'')+'">GAP '+(nB-nA>0?'+':'')+(nB-nA)+'</div></div>'
    +'<div class="kpi"><div class="t">自研总轮次均值（'+metric.toUpperCase()+'）</div><div class="v"><span style="color:var(--c-a)">A '+fmt(sumA)+' MB</span><span style="color:var(--c-b)">B '+fmt(sumB)+' MB</span></div><div class="gap '+gapCls(g.gap)+'">GAP '+(g.gap>0?'+':'')+fmt(g.gap)+' MB（'+esc(g.txt)+'）</div></div>'
    +'</div>';
  h += '<div class="card" style="margin-top:16px"><h3>自研进程明细</h3><div class="tbl-wrap"><table><thead><tr>'
    +'<th>进程</th><th>层级 A</th><th>层级 B</th><th class="num">出现 A</th><th class="num">出现 B</th><th class="num">轮均 A</th><th class="num">轮均 B</th><th class="num">值均 A</th><th class="num">值均 B</th><th class="num">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody>'
    + rows.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).map(r=>'<tr><td><a href="#proc='+encodeURIComponent(r.p)+'">'+esc(r.p)+'</a></td>'
      +'<td>'+esc([...procLevelSet(0,r.p)].join('、')||'—')+'</td><td>'+esc([...procLevelSet(1,r.p)].join('、')||'—')+'</td>'
      +'<td class="num">'+r.ka+'/'+N(0)+'</td><td class="num">'+r.kb+'/'+N(1)+'</td>'
      +'<td class="num">'+fmt(r.ra)+'</td><td class="num">'+fmt(r.rb)+'</td><td class="num">'+fmt(r.va)+'</td><td class="num">'+fmt(r.vb)+'</td>'
      +gapCells(r.ra,r.rb)+'<td>'+tags(r.p)+'</td></tr>').join('')
    +'</tbody></table></div></div>';
  el.innerHTML = h;
}
RENDER.inhouse = renderInhouse;

/* ============ 6. 启动/唤醒分析 ============ */
function renderEvents(){
  const el = document.getElementById('page-events');
  let h = '<div class="card"><h3>启动原因分布 <span class="sub">仅统计测试时间窗口内的 start 事件</span></h3><div id="evChart" class="chart"></div></div>';
  h += '<div class="card"><h3>唤醒链 <span class="sub">输入进程名或关键词，展示「被谁拉起 → 进程 → 拉起了谁」</span></h3>'
    +'<div class="controls"><input type="text" id="evKw" placeholder="进程关键词（如 atomicbrain）" value="'+esc(state.evQ)+'" style="width:280px"></div>'
    +'<div id="wakePanel"></div></div>';
  h += '<div class="card"><h3>事件明细 <span class="sub">灰色 = 测试开始前事件</span></h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>数据集</th><th>时间</th><th>类型</th><th>进程</th><th>原因</th><th>组件</th><th>调用方</th></tr></thead><tbody id="evBody"></tbody></table></div></div>';
  el.innerHTML = h;
  // stacked bar of start reasons in window
  const reasons = new Map();
  const cnts = [new Map(), new Map()];
  [0,1].forEach(i=>INFO[i].events.forEach(e=>{
    if (e.type!=='start' || !evInWindow(i,e)) return;
    const r = e.reason || '(无)';
    reasons.set(r, (reasons.get(r)||0)+1);
    cnts[i].set(r,(cnts[i].get(r)||0)+1);
  }));
  const rlist = [...reasons.keys()].sort((a,b)=>reasons.get(b)-reasons.get(a));
  makeChart(document.getElementById('evChart')).setOption({
    tooltip:{trigger:'axis'}, legend:{type:'scroll',top:0},
    grid:{top:36,left:50,right:20,bottom:30},
    xAxis:{type:'category',data:['A '+LA,'B '+LB]},
    yAxis:{type:'value',name:'次数'},
    series:rlist.map(r=>({name:r,type:'bar',stack:'s',data:[cnts[0].get(r)||0,cnts[1].get(r)||0]}))
  });
  // keyword-driven table + wake chain
  const kw = document.getElementById('evKw');
  const evBody = document.getElementById('evBody');
  const wake = document.getElementById('wakePanel');
  const fill = ()=>{
    state.evQ = kw.value.trim();
    const k = state.evQ;
    let rows='';
    [0,1].forEach(i=>INFO[i].events.forEach(e=>{
      if (k && !(e.proc||'').includes(k) && !(e.comp||'').includes(k) && !(e.caller||'').includes(k)) return;
      rows += '<tr'+(evInWindow(i,e)?'':' class="pretest"')+'><td>'+(i?'B':'A')+'</td><td class="mono">'+esc(e.t)+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.proc||'')+'</td><td>'+esc(e.reason||'')+'</td><td class="mono">'+esc(e.comp||'')+'</td><td>'+esc(e.caller||'')+'</td></tr>';
    }));
    evBody.innerHTML = rows || '<tr><td colspan="7" class="muted">无匹配事件</td></tr>';
    // wake chain: resolve proc = exact match else first containing
    if (!k){ wake.innerHTML='<div class="muted">输入进程关键词以查看唤醒链。</div>'; return; }
    const procs = new Set();
    [0,1].forEach(i=>INFO[i].events.forEach(e=>{ if(e.proc) procs.add(e.proc); if(e.caller) procs.add(e.caller); }));
    let target = procs.has(k) ? k : [...procs].find(p=>p.includes(k));
    if (!target){ wake.innerHTML='<div class="muted">未在事件中找到匹配进程。</div>'; return; }
    const box = i=>{
      const pulledBy = INFO[i].events.filter(e=>e.type==='start' && e.proc===target);
      const pulls = INFO[i].events.filter(e=>e.type==='start' && e.caller===target && e.proc!==target);
      const li1 = pulledBy.map(e=>'<li'+(evInWindow(i,e)?'':' class="muted"')+'><b>'+esc(e.caller||'(未知)')+'</b> · '+esc(e.reason||'')+' · '+esc(e.t)+(evInWindow(i,e)?'':'（测试前）')+'</li>').join('')||'<li class="muted">无</li>';
      const li2 = pulls.map(e=>'<li'+(evInWindow(i,e)?'':' class="muted"')+'><b>'+esc(e.proc)+'</b> · '+esc(e.reason||'')+' · '+esc(e.t)+(evInWindow(i,e)?'':'（测试前）')+'</li>').join('')||'<li class="muted">无</li>';
      return '<div class="box"><h5>被谁拉起（'+(i?'B':'A')+'）</h5><ul>'+li1+'</ul></div>'
        +'<div class="mid">'+(i?'B':'A')+'<br>'+esc(target)+'</div>'
        +'<div class="box"><h5>拉起了谁（'+(i?'B':'A')+'）</h5><ul>'+li2+'</ul></div>';
    };
    wake.innerHTML = '<div class="wake">'+box(0)+'</div><div class="wake" style="margin-top:14px">'+box(1)+'</div>';
  };
  kw.oninput = fill; fill();
}
RENDER.events = renderEvents;

/* ============ 7. Markdown 报告 ============ */
function buildReportMd(){
  const L=[];
  const gapTxt=(a,b)=>{const g=gapInfo(a,b);return (g.gap>0?'+':'')+fmt(g.gap)+' / '+g.txt;};
  L.push('# 静态内存对比报告（示例）');
  L.push('');
  L.push('- 基线 A：**'+LA+'**　对比 B：**'+LB+'**');
  L.push('- 统计指标：**'+metric.toUpperCase()+'**；轮次：A '+N(0)+' 轮 / B '+N(1)+' 轮');
  L.push('');
  L.push('## 设备信息');
  L.push('');
  L.push('| 字段 | A | B |');
  L.push('|---|---|---|');
  infoRows().forEach(r=>L.push('| '+r.k+' | '+r.a+' | '+r.b+' |'));
  L.push('');
  L.push('## 整机内存均值对比（MB）');
  L.push('');
  L.push('| 指标 | A 均值 | B 均值 | GAP / GAP% |');
  L.push('|---|---|---|---|');
  kpiDefs().forEach(d=>{const ra=rmean(d.f(0),N(0)),rb=rmean(d.f(1),N(1));L.push('| '+d.t+' | '+fmt(ra)+' | '+fmt(rb)+' | '+gapTxt(ra,rb)+' |');});
  L.push('');
  L.push('## 层级均值对比（'+metric.toUpperCase()+'，MB）');
  L.push('');
  L.push('| 层级 | A 均值 | B 均值 | GAP / GAP% |');
  L.push('|---|---|---|---|');
  levelGapRows().forEach(r=>L.push('| '+r.L+' | '+fmt(r.ra)+' | '+fmt(r.rb)+' | '+gapTxt(r.ra,r.rb)+' |'));
  L.push('');
  L.push('## GAP Top 进程（Top 10）');
  L.push('');
  L.push('| 进程 | A 轮均 | B 轮均 | GAP / GAP% |');
  L.push('|---|---|---|---|');
  procGapRows().sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,10).forEach(r=>L.push('| '+r.p+' | '+fmt(r.ra)+' | '+fmt(r.rb)+' | '+gapTxt(r.ra,r.rb)+' |'));
  L.push('');
  const rows=procGapRows();
  const onlyA=rows.filter(r=>r.ka>0&&r.kb===0), onlyB=rows.filter(r=>r.kb>0&&r.ka===0);
  L.push('## 独有进程');
  L.push('');
  L.push('- 仅 A（'+onlyA.length+'）：'+onlyA.map(r=>r.p).join('、'));
  L.push('- 仅 B（'+onlyB.length+'）：'+onlyB.map(r=>r.p).join('、'));
  L.push('');
  const ih = rows.filter(r=>isInhouse(r.p));
  const sumA=ih.reduce((s,r)=>s+r.ra,0), sumB=ih.reduce((s,r)=>s+r.rb,0);
  L.push('## 自研应用');
  L.push('');
  L.push('- 自研进程数：A '+ih.filter(r=>r.ka>0).length+' / B '+ih.filter(r=>r.kb>0).length+'；总轮次均值：A '+fmt(sumA)+' MB / B '+fmt(sumB)+' MB（GAP '+gapTxt(sumA,sumB)+'）');
  L.push('- 自研判定：示例规则按包名前缀匹配，正式版将使用自研白名单。');
  L.push('');
  L.push('## 结论要点');
  L.push('');
  findings().forEach(f=>L.push('- '+f.replace(/<[^>]+>/g,'')));
  return L.join('\n');
}
function mdToHtml(md){
  const lines = md.split('\n');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let html='', i=0;
  const parseRow = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  while (i<lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l)){
      const rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const head=parseRow(rows[0]);
      const body=rows.slice(2).map(parseRow);
      html += '<div class="tbl-wrap"><table class="mdtbl"><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        + body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;
    }
    let m;
    if ((m=l.match(/^###\s+(.*)/))){html+='<h3>'+inline(m[1])+'</h3>';i++;continue;}
    if ((m=l.match(/^##\s+(.*)/))){html+='<h2>'+inline(m[1])+'</h2>';i++;continue;}
    if ((m=l.match(/^#\s+(.*)/))){html+='<h1>'+inline(m[1])+'</h1>';i++;continue;}
    if (/^\s*-\s+/.test(l)){
      html+='<ul>';
      while(i<lines.length && /^\s*-\s+/.test(lines[i])){html+='<li>'+inline(lines[i].replace(/^\s*-\s+/,''))+'</li>';i++;}
      html+='</ul>';continue;
    }
    if (l.trim()===''){i++;continue;}
    html+='<p>'+inline(l)+'</p>';i++;
  }
  return html;
}
function renderReport(){
  const el = document.getElementById('page-report');
  const md = buildReportMd();
  let h = '<div class="card"><h3>Markdown 报告 <span class="sub">由数据自动生成</span></h3>'
    +'<div class="controls"><button class="seg" id="mdToggle">'+(state.mdRaw?'查看渲染效果':'查看原始 Markdown')+'</button></div>'
    +(state.mdRaw ? '<div class="mdraw">'+esc(md)+'</div>' : '<div class="mdview">'+mdToHtml(md)+'</div>')
    +'</div>';
  el.innerHTML = h;
  document.getElementById('mdToggle').onclick = ()=>{state.mdRaw=!state.mdRaw;renderReport();};
}
RENDER.report = renderReport;

/* ============ 进程详情 ============ */
function openProc(name){
  const ov = document.getElementById('procOverlay');
  ov.classList.add('open');
  const inner = document.getElementById('procInner');
  const ta=procTotal(0,name), tb=procTotal(1,name);
  const ra=rmean(ta,N(0)), rb=rmean(tb,N(1)), g=gapInfo(ra,rb);
  let h = '<button class="backbtn" id="procBack">← 返回 '+(PAGES[state.tab]||'')+'</button>'
    +'<div class="card"><h3 style="font-size:16px">'+esc(name)+' <span class="sub">'+tags(name)+'　'+metric.toUpperCase()+'：A 轮均 '+fmt(ra)+' / B 轮均 '+fmt(rb)+' / GAP '+(g.gap>0?'+':'')+fmt(g.gap)+'（'+esc(g.txt)+'）</span></h3>'
    +'<div id="pdChart" class="chart"></div>'
    +'<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>轮次</th><th>A 层级</th><th class="num">A '+metric.toUpperCase()+' (MB)</th><th>B 层级</th><th class="num">B '+metric.toUpperCase()+' (MB)</th></tr></thead><tbody>';
  const nR = Math.max(N(0),N(1));
  for(let r=0;r<nR;r++){
    const la=levelAt(0,name,r), lb=levelAt(1,name,r);
    h += '<tr><td>第'+(r+1)+'轮</td><td>'+(la?'<span class="pill" style="border-left:4px solid '+lvColor(la)+'">'+esc(la)+'</span>':'<span class="muted">—</span>')+'</td><td class="num">'+fmt(ta[r])+'</td>'
      +'<td>'+(lb?'<span class="pill" style="border-left:4px solid '+lvColor(lb)+'">'+esc(lb)+'</span>':'<span class="muted">—</span>')+'</td><td class="num">'+fmt(tb[r])+'</td></tr>';
  }
  h += '</tbody></table></div></div>';
  h += '<div class="card"><h3>相关事件 <span class="sub">含该进程启动/消亡，以及作为调用方拉起其他进程</span></h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>数据集</th><th>时间</th><th>类型</th><th>进程</th><th>原因</th><th>组件</th><th>调用方</th></tr></thead><tbody>';
  let any=false;
  [0,1].forEach(i=>INFO[i].events.forEach(e=>{
    if (e.proc!==name && e.caller!==name) return;
    any=true;
    h += '<tr'+(evInWindow(i,e)?'':' class="pretest"')+'><td>'+(i?'B':'A')+'</td><td class="mono">'+esc(e.t)+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.proc||'')+'</td><td>'+esc(e.reason||'')+'</td><td class="mono">'+esc(e.comp||'')+'</td><td>'+esc(e.caller||'')+'</td></tr>';
  }));
  h += (any?'':'<tr><td colspan="7" class="muted">无相关事件</td></tr>')+'</tbody></table></div></div>';
  inner.innerHTML = h;
  document.getElementById('procBack').onclick = ()=>{ location.hash='tab='+state.tab; };
  makeChart(document.getElementById('pdChart')).setOption({
    tooltip:{trigger:'axis'}, legend:{top:0},
    grid:{top:36,left:60,right:20,bottom:30},
    xAxis:{type:'category',data:roundCats(nR)},
    yAxis:{type:'value',name:'MB'},
    series:[
      {name:'A '+LA,type:'line',data:ta,itemStyle:{color:'#3b82f6'},lineStyle:{color:'#3b82f6'},symbolSize:6,connectNulls:false},
      {name:'B '+LB,type:'line',data:tb,itemStyle:{color:'#f59e0b'},lineStyle:{color:'#f59e0b',type:'dashed'},symbolSize:6,connectNulls:false}
    ]
  });
  ov.scrollTop = 0;
}

route();
