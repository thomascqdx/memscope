<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --c-a:#3b82f6; --c-b:#f59e0b;
  --bg:#f5f7fb; --card:#fff; --line:#e6eaf2; --line-soft:#eef2f7;
  --txt:#0f172a; --sub:#64748b; --brand:#4f46e5; --brand-soft:#eef2ff;
  --red:#e11d48; --red-soft:#fff1f2; --green:#059669; --green-soft:#ecfdf5;
  --font:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
a[href^="#proc="]{font-weight:500}

/* ---------- 顶栏 ---------- */
#topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-row{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(79,70,229,.3)}
.bar-row h1{font-size:16px;margin:0;white-space:nowrap;font-weight:600}
.bar-row h1 .sub{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip-a .dot{background:var(--c-a)}
.chip-b .dot{background:var(--c-b)}
.chip b{font-weight:600;color:var(--txt)}
.toggles{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub)}
.segtrack{display:flex;background:#f1f5f9;border-radius:999px;padding:3px}
.seg{border:none;background:transparent;padding:4px 16px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--sub);font-family:var(--font)}
.seg.active{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(16,24,40,.14);font-weight:500}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--sub);user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{width:36px;height:20px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .15s;flex:none}
.switch .sl::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.sl{background:var(--brand)}
.switch input:checked+.sl::after{transform:translateX(16px)}
#tabnav{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
#tabnav button{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;position:relative;font-family:var(--font)}
#tabnav button:hover{color:var(--txt);background:#f6f8fc}
#tabnav button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:transparent}
#tabnav button.active{color:var(--brand);font-weight:600}
#tabnav button.active::after{background:var(--brand)}

/* ---------- 布局 / 卡片 ---------- */
main{max-width:1400px;margin:0 auto;padding:20px 20px 48px}
.tab-page{display:none}
.tab-page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-hd h3{margin:0;font-size:15px;font-weight:600}
.card-hd .sub{font-size:12px;color:var(--sub);font-weight:400;margin-top:3px}
.card-hd-r{display:flex;gap:8px;align-items:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0}
.row-2col{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.row-2col>*{min-width:0}
.row-2col .card{margin-bottom:0}
@media(max-width:1000px){.row-2col{grid-template-columns:1fr}}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:999px){.grid-kpi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-kpi{grid-template-columns:1fr}}
.grid-kpi.auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi-name{font-size:13px;font-weight:600}
.kpi-src{font-size:11px;color:var(--sub)}
.kpi-v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-v .u{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.kpi-ab{font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-ab .arr{color:var(--sub);margin:0 5px}
.kpi-delta{margin-top:7px}
.spark{display:block;width:100%;height:36px;margin-top:8px}

/* ---------- delta 徽标 / 标签 / 状态 ---------- */
.delta{display:inline-flex;align-items:center;gap:2px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.bad{background:var(--red-soft);color:var(--red)}
.delta.good{background:var(--green-soft);color:var(--green)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;margin:0 4px 2px 0;font-weight:500}
.tag-a{background:#eff6ff;color:#1d4ed8}
.tag-b{background:#fffbeb;color:#b45309}
.tag-lv{background:#f5f3ff;color:#6d28d9}
.tag-ih{background:var(--green-soft);color:#047857}
.tag-sig{background:var(--red-soft);color:#be123c}
.tag-cached{background:#f1f5f9;color:#64748b}
.st{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:500}
.st-ok{background:var(--green-soft);color:var(--green)}
.st-bad{background:var(--red-soft);color:var(--red)}
.sc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 9px;border-radius:999px;background:#f1f5f9;color:#475569;margin-right:6px;vertical-align:1px}
.sc::before{content:'';width:6px;height:6px;border-radius:50%}
.sc-a::before{background:var(--c-a)}
.sc-b::before{background:var(--c-b)}
.cnt{display:inline-block;min-width:20px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;margin-left:6px}
.gap-pos{color:var(--red);font-weight:600}
.gap-neg{color:var(--green);font-weight:600}
.muted{color:var(--sub)}
.sec-h{font-size:13px;font-weight:600;margin-bottom:8px}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.tbl-wrap.no-max{max-height:none}
.tbl-wrap.h320{max-height:320px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;text-align:left;height:40px}
th{position:sticky;top:0;background:#f8fafc;color:var(--sub);font-size:12px;font-weight:600;z-index:2;height:auto}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name{white-space:normal;word-break:break-all;min-width:220px;max-width:420px}
td.bv{font-weight:600}
tbody tr:hover td{background:#f8faff}
tr.lvl-row td{cursor:pointer;background:#f6f8fe;font-weight:600}
tr.lvl-row td:first-child{position:relative;padding-left:30px}
tr.lvl-row td:first-child::before{content:'›';position:absolute;left:13px;top:50%;margin-top:-10px;font-size:15px;color:var(--sub);display:inline-block;transform:rotate(0);transition:transform .15s}
tr.lvl-row.open td:first-child::before{transform:rotate(90deg)}
tr.proc-row td{font-weight:400}
tr.proc-row td:first-child{padding-left:30px}
tr.diff td{background:#fffbeb}
tr.diff td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
tr.viol td{background:var(--red-soft)}
tr.viol td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.phaseboot td{color:var(--sub);background:#fafbfc}

/* ---------- 控件 ---------- */
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--sub)}
.controls label{display:inline-flex;align-items:center;gap:6px}
input[type=text],input[type=number],select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff;color:var(--txt);font-family:var(--font)}
input[type=number]{width:84px}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.btn{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:13px;background:#fff;color:var(--txt);cursor:pointer;font-family:var(--font)}
.btn:hover{border-color:#c7cfdd;background:#f8fafc}
.btn.ghost{background:#fff}
.btn:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- 多选选择器 ---------- */
.mp{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 8px;min-height:44px;margin-bottom:12px}
.mp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:#3730a3;border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;font-weight:500}
.mp-chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mp-chip b{cursor:pointer;color:#818cf8;font-weight:600;padding:0 4px;line-height:1}
.mp-chip b:hover{color:var(--red)}
.mp-input{flex:1;min-width:150px;border:none;outline:none;height:28px;font-size:13px;background:transparent;color:var(--txt);font-family:var(--font);padding:0 4px}
.mp-clear{border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:2px 6px;font-family:var(--font)}
.mp-clear:hover{color:var(--red)}
.mp-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);z-index:60;display:none}
.mp-menu.open{display:block}
.mp-it{padding:7px 12px;font-size:13px;cursor:pointer}
.mp-it:hover{background:#f8faff}
.mp-it.muted{cursor:default}
.mp-it.muted:hover{background:none}

/* ---------- 图表 / 其它 ---------- */
.chart{width:100%;height:340px}
.chart-tall{height:460px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
.strip{display:flex;gap:2px;align-items:center;margin:3px 0}
.strip .cell{width:18px;height:14px;border-radius:4px;display:inline-block}
.strip .cell.empty{background:#f1f5f9;border:1px dashed #cbd5e1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0 10px}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.pkg-cols{display:grid;gap:14px}
.mono-list{list-style:none;margin:8px 0 0;padding:0;font-family:Consolas,"Courier New",monospace;font-size:12px;max-height:200px;overflow:auto}
.mono-list li{padding:3px 0;border-bottom:1px dashed var(--line-soft);word-break:break-all}
ul.findings{list-style:none;margin:0;padding:0}
ul.findings li{position:relative;padding-left:16px;margin:10px 0;line-height:1.6;overflow-wrap:anywhere}
ul.findings li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
details.info{border:1px solid var(--line);background:#fbfcfe;border-radius:10px;margin-bottom:16px;font-size:12.5px;color:var(--sub)}
details.info summary{cursor:pointer;padding:9px 14px;font-weight:500;list-style:none;display:flex;align-items:center;user-select:none}
details.info summary::-webkit-details-marker{display:none}
details.info summary::before{content:'ⓘ';color:var(--brand);margin-right:7px}
details.info summary::after{content:'▸';margin-left:auto;color:#94a3b8;transition:transform .15s}
details.info[open] summary::after{transform:rotate(90deg)}
details.info .info-body{padding:10px 14px;border-top:1px dashed var(--line);line-height:1.6}
details.info .info-body code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace}
.warn{position:relative;background:var(--red-soft);border:1px solid #fecdd3;color:#9f1239;border-radius:10px;padding:10px 14px 10px 34px;font-size:13px;margin-bottom:16px;line-height:1.6}
.warn::before{content:'⚠';position:absolute;left:13px;top:10px}
.wake{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:10px;align-items:center;margin-top:10px}
.wake .mid{display:flex;align-items:center;background:var(--brand-soft);color:#3730a3;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px;white-space:nowrap}
.wake .warr{color:#94a3b8;font-size:15px}
.wake .box{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;align-self:stretch}
.wake .box h5{margin:0 0 8px;font-size:12.5px;color:var(--sub);font-weight:600}
.wake .box ul{margin:0;padding-left:16px}
.wake .box li{margin:4px 0;line-height:1.5}
.pill{display:inline-flex;align-items:center;background:#f8fafc;border:1px solid var(--line-soft);border-radius:999px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
td.comp{white-space:normal;word-break:break-all;min-width:220px;max-width:380px}
#procOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow:auto;display:none}
#procOverlay.open{display:block}
#procOverlay .inner{max-width:1400px;margin:0 auto;padding:20px}
.pd-head{margin:14px 0 14px}
.pd-head h2{font-size:20px;margin:0 0 8px;word-break:break-all;font-weight:600}
.pd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:800px){.pd-stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.stat .t{font-size:12px;color:var(--sub);margin-bottom:5px}
.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v .uu{font-size:12px;color:var(--sub);font-weight:400}
.stat .v .delta{font-size:13px}
.mdraw{white-space:pre-wrap;font-family:Consolas,"Courier New",monospace;font-size:12.5px;background:#f8fafc;color:var(--txt);border:1px solid var(--line);padding:16px;border-radius:10px;overflow:auto;max-height:640px}
.mdview{max-width:980px}
.mdview h1{font-size:20px;margin:24px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mdview h2{font-size:17px;margin:22px 0 8px;border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.mdview h3{font-size:15px;margin:18px 0 6px}
.mdview p{margin:8px 0;line-height:1.7}
.mdview ul{margin:8px 0;padding-left:20px}
.mdview li{margin:4px 0}
.mdview .tbl-wrap{margin:10px 0}
.mdview code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12.5px}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:10px 0 0}

.sev{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-right:6px}
.sev-high{background:var(--red-soft);color:var(--red)}
.sev-mid{background:#fffbeb;color:#b45309}
.sev-low{background:#f5f3ff;color:#6d28d9}
.sev-info{background:#eff6ff;color:#1d4ed8}
th.sort:hover{background:#eef2ff}
.pname{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname a{display:block;overflow:hidden;text-overflow:ellipsis}
.lvcell{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header id="topbar">
  <div class="bar-row">
    <div class="brand"><span class="logo">M</span><h1>动态内存对比分析<span class="sub">memscope</span></h1></div>
    <div class="chips">
      <span class="chip chip-a"><i class="dot"></i>基线 A：<b id="chipA"></b></span>
      <span class="chip chip-b"><i class="dot"></i>对比 B：<b id="chipB"></b></span>
    </div>
    <div class="toggles">
      <span class="segtrack"><button class="seg" data-m="pss">PSS</button><button class="seg active" data-m="rss">RSS</button></span>
      <label class="switch"><input type="checkbox" id="incCached"><span class="sl"></span><span>包含 Cached</span></label>
    </div>
  </div>
  <nav id="tabnav"></nav>
</header>
<main id="main">
  <section class="tab-page" id="page-overview"></section>
  <section class="tab-page" id="page-system"></section>
  <section class="tab-page" id="page-levels"></section>
  <section class="tab-page" id="page-procs"></section>
  <section class="tab-page" id="page-inhouse"></section>
  <section class="tab-page" id="page-events"></section>
  <section class="tab-page" id="page-pressure"></section>
  <section class="tab-page" id="page-risk"></section>
  <section class="tab-page" id="page-report"></section>
  <div class="foot" id="foot"></div>
</main>
<div id="procOverlay"><div class="inner" id="procInner"></div></div>

<script>//__ECHARTS_INLINE//</script>
<script>const DATA = /*__RESULT_JSON__*/null;</script>
<script>
'use strict';
/* ============ 基础 ============ */
const LA = DATA.labels[0], LB = DATA.labels[1];
const DS = DATA.datasets;
let metric = 'rss';
let includeCached = false;
const MV = () => DATA.metrics[metric];
const FONT = '"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif';
const LEVEL_COLORS = {'Native':'#64748b','System':'#0ea5e9','Persistent':'#8b5cf6','Persistent Service':'#a78bfa','Foreground':'#22c55e','Visible':'#84cc16','Perceptible':'#eab308','Perceptible Medium':'#f59e0b','Perceptible Low':'#f97316','Backup':'#a16207','Heavy Weight':'#78350f','A Services':'#ec4899','Home':'#10b981','Previous':'#78716c','B Services':'#14b8a6','Cached':'#94a3b8'};
const PROC_PALETTE = ['#0ea5e9','#e11d48','#8b5cf6','#16a34a','#f97316','#0891b2','#be185d','#65a30d','#7c3aed','#b45309'];
const CA = '#3b82f6', CB = '#f59e0b';
const lvColor = l => LEVEL_COLORS[l] || '#475569';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = (v,d) => v==null ? '—' : (+v).toFixed(d==null?2:d);
const fmt0 = v => v==null ? '—' : Math.round(v).toLocaleString();
const cardHd = (t,s,r)=>'<div class="card-hd"><div><h3>'+t+'</h3>'+(s?'<div class="sub">'+s+'</div>':'')+'</div>'+(r?'<div class="card-hd-r">'+r+'</div>':'')+'</div>';
function gapCls(gap, reversed){
  if (gap==null || gap===0) return '';
  const worse = reversed ? gap<0 : gap>0;
  return worse ? 'gap-pos' : 'gap-neg';
}
function deltaCls(gap, reversed, gapt){
  if (gapt==='新增') return 'bad';
  if (gapt==='消失') return 'good';
  if (gap==null || gap===0) return '';
  return (reversed ? gap<0 : gap>0) ? 'bad' : 'good';
}
function deltaBadge(txt, cls, gap){
  const arrow = (gap==null || gap===0) ? '' : (gap>0?'▲ ':'▼ ');
  return '<span class="delta'+(cls?' '+cls:'')+'">'+arrow+esc(txt)+'</span>';
}
function gapCells(ra, rb, gapt, gapp, reversed){
  const gap = rb-ra;
  const txt = gapt || (gapp==null?'—':(gapp>0?'+':'')+gapp.toFixed(1)+'%');

function multiPicker(o){
  const el = o.el;
  el.classList.add('mp');
  el.innerHTML = '<input class="mp-input" type="text" placeholder="'+esc(o.placeholder||'搜索添加…')+'"><button type="button" class="mp-clear">清空</button><div class="mp-menu"></div>';
  const input = el.querySelector('.mp-input'), menu = el.querySelector('.mp-menu');
  const sel = o.selected.slice();
  const emit = ()=>o.onChange(sel.slice());
  const drawChips = ()=>{
    el.querySelectorAll('.mp-chip').forEach(c=>c.remove());
    sel.forEach((name,idx)=>{
      const c = document.createElement('span');
      c.className = 'mp-chip';
      c.innerHTML = '<i style="background:'+o.colorOf(name,idx)+'"></i>'+esc(name)+'<b title="移除">×</b>';
      c.querySelector('b').onclick = ()=>{ sel.splice(idx,1); drawChips(); emit(); };
      el.insertBefore(c, input);
    });
  };
  const hide = ()=>menu.classList.remove('open');
  const show = ()=>{
    const q = input.value.trim().toLowerCase();
    const list = o.options.filter(n=>!sel.includes(n) && (!q || n.toLowerCase().includes(q))).slice(0,50);
    menu.innerHTML = list.map(n=>'<div class="mp-it" data-n="'+esc(n)+'">'+esc(n)+'</div>').join('')
      || '<div class="mp-it muted">无匹配项</div>';
    menu.classList.add('open');
    menu.querySelectorAll('.mp-it[data-n]').forEach(it=>{
      it.onmousedown = e=>{ e.preventDefault(); sel.push(it.dataset.n); input.value=''; drawChips(); emit(); show(); };
    });
  };
  input.addEventListener('focus', show);
  input.addEventListener('input', show);
  input.addEventListener('keydown', e=>{ if(e.key==='Escape'){ hide(); input.blur(); } });
  input.addEventListener('blur', ()=>setTimeout(hide,150));
  el.querySelector('.mp-clear').onclick = ()=>{ sel.length=0; drawChips(); emit(); };
  drawChips();
}

function parseHash(){
  const q = new URLSearchParams(location.hash.replace(/^#/,''));
  return {tab:q.get('tab'), proc:q.get('proc'), metric:q.get('metric')};
}
function setHash(patch){
  const q = new URLSearchParams(location.hash.replace(/^#/,''));
  for (const k in patch){ if(patch[k]==null) q.delete(k); else q.set(k, patch[k]); }
  const h = q.toString();
  if (location.hash.slice(1) !== h) location.hash = h;
}
function applyMetric(m){
  if (!DATA.metrics[m]) return;
  metric = m;
  document.querySelectorAll('.toggles .seg').forEach(x=>x.classList.toggle('active', x.dataset.m===m));
}
function route(){
  const p = parseHash();
  if (p.metric) applyMetric(p.metric);
  if (p.proc){ openProc(p.proc); return; }
  document.getElementById('procOverlay').classList.remove('open');
  const tab = (p.tab && PAGES[p.tab]) ? p.tab : 'overview';
  state.tab = tab;
  document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-page').forEach(s=>s.classList.toggle('active', s.id==='page-'+tab));
  RENDER[tab]();
  window.scrollTo(0,0);
}

/* ============ 4. 进程 ============ */
RENDER.procs = function(){
  const el = document.getElementById('page-procs');
  const m = MV();
  const list = m.top.map(n=>m.procs[n]).filter(showProc);
  let h = IH_NOTE;
  h += '<div class="card">'+cardHd('进程对比表（'+list.length+'）',metric.toUpperCase()+' · 点击列头排序 · 点击进程进详情')
    +'<div class="controls"><input type="text" id="pkKw" placeholder="关键词，多个用逗号分隔" value="'+esc(state.pkKw)+'" style="width:240px">'
    +'<select id="pkLevel"><option value="">全部层级</option>'+m.levels.map(L=>'<option'+(state.pkLevel===L?' selected':'')+'>'+esc(L)+'</option>').join('')+'</select>'
    +'<label><input type="checkbox" id="pkInhouse"'+(state.pkInhouse?' checked':'')+'> 仅自研</label>'
    +'<label><input type="checkbox" id="pkSigOnly"'+(state.pkSigOnly?' checked':'')+'> 仅显著</label>'
    +'<label><input type="checkbox" id="pkResident"'+(state.pkResident?' checked':'')+'> 仅常驻B</label>'
    +'<label><input type="checkbox" id="pkLeak"'+(state.pkLeak?' checked':'')+'> 仅泄漏</label>'
    +'<label>|GAP| ≥ <input type="number" id="pkGapMin" min="0" step="1" value="'+state.pkGapMin+'"> MB</label></div>'
    +'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>进程</th><th>层级 A</th><th>层级 B</th>'
    +'<th class="num sort" data-k="rate">出现率A/B</th>'
    +'<th class="num sort" data-k="mi">mi A</th><th class="num sort" data-k="mi">mi B</th>'
    +'<th class="num sort" data-k="p90">P90 A</th><th class="num sort" data-k="p90">P90 B</th>'
    +'<th class="num sort" data-k="max">最大A/B</th>'
    +'<th class="num sort" data-k="gap">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody id="pkBody"></tbody></table></div></div>';
  el.innerHTML = h;
  const pkBody = document.getElementById('pkBody');
  const keyVal = (p,k,side)=> (side==='a'? p.da[k] : p.db[k]);
  const fillPk = ()=>{
    const kws = state.pkKw.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    let rows = list.filter(p=>{
      if (kws.length && !kws.some(k=>p.name.includes(k))) return false;
      if (state.pkLevel && !p.la.includes(state.pkLevel) && !p.lb.includes(state.pkLevel)) return false;
      if (state.pkInhouse && !p.inhouse) return false;
      if (state.pkSigOnly && !p.sig) return false;
      if (state.pkResident && !p.resident_b) return false;
      if (state.pkLeak && !p.leak_a && !p.leak_b) return false;
      if (Math.abs(p.gap) < state.pkGapMin) return false;
      return true;
    });
    const k = state.pkSort, dir = state.pkDir;
    rows.sort((x,y)=>{
      const vx = k==='gap'? x.gap : k==='mi'? x.db.mi : k==='p90'? (x.db.p90??-1) : k==='max'? (x.db.max??-1) : x.db.rate;
      const vy = k==='gap'? y.gap : k==='mi'? y.db.mi : k==='p90'? (y.db.p90??-1) : k==='max'? (y.db.max??-1) : y.db.rate;
      return (vx-vy)*dir;
    });
    pkBody.innerHTML = rows.map(p=>'<tr><td class="name pname" title="'+esc(p.name)+'">'+procLink(p.name)+'</td>'
      +'<td class="lvcell" title="'+esc(p.la.join('、')||'—')+'">'+esc(p.la[0]||'—')+(p.la.length>1?' +'+(p.la.length-1):'')+'</td>'
      +'<td class="lvcell" title="'+esc(p.lb.join('、')||'—')+'">'+esc(p.lb[0]||'—')+(p.lb.length>1?' +'+(p.lb.length-1):'')+'</td>'
      +'<td class="num">'+Math.round(p.da.rate*100)+'%/'+Math.round(p.db.rate*100)+'%</td>'
      +'<td class="num">'+fmt(p.da.mi)+'</td><td class="num">'+fmt(p.db.mi)+'</td>'
      +'<td class="num">'+fmt(p.da.p90)+'</td><td class="num">'+fmt(p.db.p90)+'</td>'
      +'<td class="num">'+fmt(p.da.max)+' / '+fmt(p.db.max)+'</td>'
      + gapCells(p.da.mi, p.db.mi, p.gapt, p.gapp) + '<td>'+procTags(p)+'</td></tr>').join('')
      || '<tr><td colspan="12" class="muted">无匹配进程</td></tr>';
  };
  document.getElementById('pkKw').oninput = e=>{state.pkKw=e.target.value;fillPk();};
  document.getElementById('pkLevel').onchange = e=>{state.pkLevel=e.target.value;fillPk();};
  document.getElementById('pkInhouse').onchange = e=>{state.pkInhouse=e.target.checked;fillPk();};
  document.getElementById('pkSigOnly').onchange = e=>{state.pkSigOnly=e.target.checked;fillPk();};
  document.getElementById('pkResident').onchange = e=>{state.pkResident=e.target.checked;fillPk();};
  document.getElementById('pkLeak').onchange = e=>{state.pkLeak=e.target.checked;fillPk();};
  document.getElementById('pkGapMin').oninput = e=>{state.pkGapMin=+e.target.value||0;fillPk();};
  el.querySelectorAll('th.sort').forEach(th=>{
    th.style.cursor='pointer';
    th.onclick = ()=>{ state.pkSort = th.dataset.k; state.pkDir = -state.pkDir; fillPk(); };
  });
  fillPk();
};

/* ============ 7. 内存压力 ============ */
RENDER.pressure = function(){
  const el = document.getElementById('page-pressure');
  const cs = DATA.pressure.counters;
  if (!state.psSel) state.psSel = cs.length? [cs[0].name] : [];
  state.psSel = state.psSel.filter(n=>cs.some(c=>c.name===n));
  const pf = v => v==null ? '—' : (Math.abs(v)>=1000 ? fmt0(v) : fmt(v));
  let h = '<div class="card">'+cardHd('内存压力计数器','proc_vmstat 每轮增量汇总 · /小时 = 总量/覆盖小时')
    +'<div class="tbl-wrap"><table><thead><tr><th>计数器</th><th>单位</th>'
    +'<th class="num">A 总量</th><th class="num">A /小时</th><th class="num">A P90/轮</th>'
    +'<th class="num">B 总量</th><th class="num">B /小时</th><th class="num">B P90/轮</th>'
    +'<th class="num">GAP/h</th><th class="num">GAP%</th></tr></thead><tbody>';
  cs.forEach(c=>{
    h += '<tr><td>'+esc(c.name)+'</td><td class="muted">'+esc(c.unit)+'</td>'
      +'<td class="num">'+pf(c.sa&&c.sa.total)+'</td><td class="num">'+pf(c.sa&&c.sa.per_hour)+'</td><td class="num">'+pf(c.sa&&c.sa.p90)+'</td>'
      +'<td class="num">'+pf(c.sb&&c.sb.total)+'</td><td class="num">'+pf(c.sb&&c.sb.per_hour)+'</td><td class="num">'+pf(c.sb&&c.sb.p90)+'</td>'
      +'<td class="num">'+pf(c.gap)+'</td><td class="num">'+(c.gapp==null?'—':(c.gapp>0?'+':'')+c.gapp.toFixed(1)+'%')+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '<div class="card">'+cardHd('每轮增量时序','x=测试小时')+'<div id="psPick"></div><div id="psChart" class="chart chart-tall"></div></div>';
  el.innerHTML = h;
  const draw = ()=>{
    const series=[];
    state.psSel.forEach((nm,idx)=>{
      const c = cs.find(x=>x.name===nm); if(!c) return;
      const solo = state.psSel.length===1;
      const col = PROC_PALETTE[idx%PROC_PALETTE.length];
      if (c.a) series.push({name:nm+'·A', type:'line', showSymbol:false, sampling:'lttb',
        data:tsData(0,c.a), itemStyle:{color:solo?CA:col}, lineStyle:{color:solo?CA:col,width:1.4}});
      if (c.b) series.push({name:nm+'·B', type:'line', showSymbol:false, sampling:'lttb',
        data:tsData(1,c.b), itemStyle:{color:solo?CB:col}, lineStyle:{color:solo?CB:col,type:'dashed',width:1.4}});
    });
    makeChart(document.getElementById('psChart')).setOption(tsOption(series,{yAxis:{type:'value',name:'增量/轮'}}));
  };
  multiPicker({el:document.getElementById('psPick'), options:cs.map(c=>c.name), selected:state.psSel,

/* ============ 9. Markdown 报告 ============ */
function mdToHtml(md){
  const lines = md.split('\n');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html='', i=0;
  const parseRow = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  while (i<lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l)){
      const rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const head=parseRow(rows[0]);
      const body=rows.slice(2).map(parseRow);
      html += '<div class="tbl-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        + body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;
    }
    let mm;
    if ((mm=l.match(/^###\s+(.*)/))){html+='<h3>'+inline(mm[1])+'</h3>';i++;continue;}
    if ((mm=l.match(/^##\s+(.*)/))){html+='<h2>'+inline(mm[1])+'</h2>';i++;continue;}
    if ((mm=l.match(/^#\s+(.*)/))){html+='<h1>'+inline(mm[1])+'</h1>';i++;continue;}
    if (/^\s*\-\s+/.test(l)){
      html+='<ul>';
      while(i<lines.length && /^\s*\-\s+/.test(lines[i])){html+='<li>'+inline(lines[i].replace(/^\s*\-\s+/,''))+'</li>';i++;}
      html+='</ul>';continue;
    }
    if (l.trim()===''){i++;continue;}
    html+='<p>'+inline(l)+'</p>';i++;
  }
  return html;
}
RENDER.report = function(){
  const el = document.getElementById('page-report');
  const md = DATA.report_md || '';
  el.innerHTML = '<div class="card">'+cardHd('Markdown 报告','与 report.md 内容一致',
      '<button class="btn ghost" id="mdToggle">'+(state.mdRaw?'查看渲染效果':'查看原始 Markdown')+'</button>')
    +(state.mdRaw ? '<div class="mdraw">'+esc(md)+'</div>' : '<div class="mdview">'+mdToHtml(md)+'</div>')
    +'</div>';
  document.getElementById('mdToggle').onclick = ()=>{state.mdRaw=!state.mdRaw;RENDER.report();};
};

/* ============ 进程详情 ============ */
function distRow(d){
  return '<td class="num">'+d.k+'/'+d.n+'</td><td class="num">'+Math.round(d.rate*100)+'%</td>'
    +'<td class="num">'+fmt(d.mi)+'</td><td class="num">'+fmt(d.mean)+'</td><td class="num">'+fmt(d.min)+'</td>'
    +'<td class="num">'+fmt(d.p50)+'</td><td class="num">'+fmt(d.p90)+'</td><td class="num">'+fmt(d.p95)+'</td><td class="num">'+fmt(d.max)+'</td>';
}
function trendRow(t){
  if (!t) return '<td colspan="5" class="muted">出现轮 <10，不判定</td>';
  return '<td class="num">'+fmt(t.head)+'</td><td class="num">'+fmt(t.tail)+'</td><td class="num">'+(t.delta>0?'+':'')+fmt(t.delta)+'</td><td class="num">'+(t.slope>0?'+':'')+fmt(t.slope)+'</td><td class="num">'+fmt(t.r2)+'</td>';
}

    +(tA!=null||tB!=null?'<span class="tag tag-lv">阈值 A '+fmt(tA,0)+' / B '+fmt(tB,0)+' MB</span>':'')+'</div></div>'
    +'<div class="pd-stats">'
    +'<div class="stat"><div class="t">A mi（轮均）</div><div class="v" style="color:var(--c-a)">'+fmt(p.da.mi)+'<span class="uu"> MB</span></div></div>'
    +'<div class="stat"><div class="t">B mi（轮均）</div><div class="v" style="color:var(--c-b)">'+fmt(p.db.mi)+'<span class="uu"> MB</span></div></div>'
    +'<div class="stat"><div class="t">GAP</div><div class="v">'+(p.gap==null?'<span class="muted">—</span>':deltaBadge((p.gap>0?'+':'')+fmt(p.gap)+' MB', dc, p.gap))+'</div></div>'
    +'<div class="stat"><div class="t">GAP%</div><div class="v">'+(p.gapp==null&&p.gapt==null?'<span class="muted">—</span>':deltaBadge(p.gapt||(p.gapp>0?'+':'')+(p.gapp==null?'—':p.gapp.toFixed(1))+'%', dc, p.gap))+'</div></div>'
    +'</div>'
    +'<div class="card">'+cardHd('逐轮走势','x=测试小时 · 实线=A '+LA+'，虚线=B '+LB+' · '+metric.toUpperCase()+' (MB)')+'<div id="pdChart" class="chart"></div></div>'
    +'<div class="grid2">'
    +'<div class="card">'+cardHd('分布统计','出现轮口径')+'<div class="tbl-wrap no-max"><table><thead><tr><th></th><th class="num">出现</th><th class="num">出现率</th><th class="num">mi</th><th class="num">均值</th><th class="num">最小</th><th class="num">P50</th><th class="num">P90</th><th class="num">P95</th><th class="num">最大</th></tr></thead><tbody>'
    +'<tr><td><b>A</b></td>'+distRow(p.da)+'</tr><tr><td><b>B</b></td>'+distRow(p.db)+'</tr>'
    +'</tbody></table></div></div>'
    +'<div class="card">'+cardHd('趋势','线性回归 · head/tail=前/后10%中位')+'<div class="tbl-wrap no-max"><table><thead><tr><th></th><th class="num">head</th><th class="num">tail</th><th class="num">delta</th><th class="num">斜率/h</th><th class="num">R²</th></tr></thead><tbody>'
    +'<tr><td><b>A</b></td>'+trendRow(p.ta)+'</tr><tr><td><b>B</b></td>'+trendRow(p.tb)+'</tr>'
    +'</tbody></table></div></div></div>'
    +'<div class="card">'+cardHd('层级出现分布','进程在各层级出现的轮数')+'<div class="tbl-wrap no-max"><table><thead><tr><th>层级</th><th class="num">A 轮数</th><th class="num">B 轮数</th></tr></thead><tbody>'
    + (()=>{const ls=new Set([...Object.keys(p.lvc_a),...Object.keys(p.lvc_b)]);return [...ls].map(l=>'<tr><td><span class="pill"><i style="background:'+lvColor(l)+'"></i>'+esc(l)+'</span></td><td class="num">'+(p.lvc_a[l]||0)+'</td><td class="num">'+(p.lvc_b[l]||0)+'</td></tr>').join('')||'<tr><td colspan="3" class="muted">无</td></tr>';})()
    +'</tbody></table></div></div>';
  inner.innerHTML = h;
