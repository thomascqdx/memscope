    colorOf:(n,idx)=>PROC_PALETTE[idx%PROC_PALETTE.length],
    onChange:sel=>{state.psSel=sel;draw(true);}, placeholder:'搜索添加计数器…'});
};

/* ============ 9. 标准与风险 ============ */
RENDER.risk = function(){
  const el = document.getElementById('page-risk');
  const sa = DATA.standards.a, sb = DATA.standards.b;
  const fails = st => (st && st.fail_items && st.fail_items.length) ? '（'+st.fail_items.join('、')+'）' : '';
  let h = '<div class="card">'+cardHd('健康标准对照（A / B）',
    'RSS 口径；阈值取各侧自己的标准 · A 判定 <b>'+(sa?sa.verdict:'无阈值')+'</b>'+fails(sa)
    +' · B 判定 <b>'+(sb?sb.verdict:'无阈值')+'</b>'+fails(sb));
  const thrCell = (ta,tb)=>{
    if (ta==null && tb==null) return '—';
    if (ta==null) return fmt(tb);
    if (tb==null) return fmt(ta);
    return ta===tb ? fmt(ta) : 'A '+fmt(ta)+' / B '+fmt(tb);
  };
  const chg = (ra,rb)=>{
    const va = ra && ra.viol, vb = rb && rb.viol;
    if (vb && !va) return '<b style="color:var(--red)">新超标</b>';
    if (va && vb) return '<span style="color:var(--red)">持续超标</span>';
    if (va && rb && !rb.viol) return '<span style="color:var(--green)">已解除</span>';
    return '—';
  };
  const jdg = r => r==null ? '—' : (r.viol ? '<span class="st st-bad">超标</span>' : '<span class="st st-ok">达标</span>');
  // 表1：层级与 Free RAM（Free RAM 在前，其后按 LEVEL 序）
  const lvKeys = [];
  [sa,sb].forEach(st=>{
    if (!st) return;
    if (st.free_ram && !lvKeys.includes('Free RAM')) lvKeys.push('Free RAM');
    (st.levels||[]).forEach(r=>{ if (!lvKeys.includes(r.name)) lvKeys.push(r.name); });
  });
  const lvOrd = ['Free RAM'].concat(Object.keys(LEVEL_COLORS));
  lvKeys.sort((x,y)=>{
    const ix = lvOrd.indexOf(x), iy = lvOrd.indexOf(y);
    return (ix<0?99:ix)-(iy<0?99:iy);
  });
  const lvRow = (st,nm) => st ? (nm==='Free RAM' ? st.free_ram : (st.levels||[]).find(r=>r.name===nm)) : null;
  if (lvKeys.length){
    h += '<div class="sec-h" style="margin:4px 0 8px">层级与 Free RAM</div>'
      +'<div class="tbl-wrap"><table><thead><tr><th>项目</th><th class="num">阈值</th>'
      +'<th class="num">A 值均</th><th class="num">B 值均</th><th class="num">A P90/P10</th><th class="num">B P90/P10</th>'
      +'<th class="num">A 峰值/最低</th><th class="num">B 峰值/最低</th><th class="num">A 超标轮</th><th class="num">B 超标轮</th>'
      +'<th>A 判定</th><th>B 判定</th><th>变化</th></tr></thead><tbody>';
    lvKeys.forEach(nm=>{
      const free = nm==='Free RAM';
      const ra = lvRow(sa,nm), rb = lvRow(sb,nm);
      const r0 = ra || rb;
      const members = (r0 && r0.members && r0.members.length>1) ? '（含 '+r0.members.filter(m=>m!==r0.name).join('、')+'）' : '';
      const qq = r => r==null ? ['—','—','—','—'] : [fmt(r.mean), fmt(free?r.p10:r.p90), fmt(free?r.low:r.peak), (r.exceed_rate*100).toFixed(1)+'%'];
      const qa = qq(ra), qb = qq(rb);
      h += '<tr'+(rb && rb.viol?' class="viol"':'')+'><td>'+esc(free?'Free RAM（下限）':nm+members)+'</td>'
        +'<td class="num">'+thrCell(ra&&ra.thr, rb&&rb.thr)+'</td>'
        +'<td class="num">'+qa[0]+'</td><td class="num">'+qb[0]+'</td>'
        +'<td class="num">'+qa[1]+'</td><td class="num">'+qb[1]+'</td>'
        +'<td class="num">'+qa[2]+'</td><td class="num">'+qb[2]+'</td>'
        +'<td class="num">'+qa[3]+'</td><td class="num">'+qb[3]+'</td>'
        +'<td>'+jdg(ra)+'</td><td>'+jdg(rb)+'</td><td>'+chg(ra,rb)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  // 表2：进程（name 并集；排序 新超标>持续超标>已解除>其余，再按阈值 desc）
  const pkSet = new Set();
  [sa,sb].forEach(st=>{ if (st) (st.procs||[]).forEach(r=>pkSet.add(r.name)); });
  const prow = (st,n) => st ? (st.procs||[]).find(r=>r.name===n) : null;
  const pord = (ra,rb) => { const va=ra&&ra.viol, vb=rb&&rb.viol; return vb&&!va?0 : va&&vb?1 : va?2 : 3; };
  const thrOf = r => r ? (r.thr||0) : 0;
  const plist = [...pkSet].sort((x,y)=>{
    const ox = pord(prow(sa,x),prow(sb,x)), oy = pord(prow(sa,y),prow(sb,y));
    if (ox!==oy) return ox-oy;
    return Math.max(thrOf(prow(sa,y)),thrOf(prow(sb,y))) - Math.max(thrOf(prow(sa,x)),thrOf(prow(sb,x)));
  });
  if (plist.length){
    h += '<div class="sec-h" style="margin:14px 0 8px">进程</div>'
      +'<div class="tbl-wrap"><table><thead><tr><th>进程</th><th>层级</th><th class="num">阈值</th>'
      +'<th class="num">A 值均</th><th class="num">B 值均</th><th class="num">A 峰值</th><th class="num">B 峰值</th>'
      +'<th class="num">A 超标轮</th><th class="num">B 超标轮</th><th>A 判定</th><th>B 判定</th><th>变化</th></tr></thead><tbody>';
    plist.forEach(n=>{
      const ra = prow(sa,n), rb = prow(sb,n);
      h += '<tr'+(rb && rb.viol?' class="viol"':'')+'><td class="name">'+procLink(n)+'</td>'
        +'<td>'+esc((rb&&rb.level)||(ra&&ra.level)||'—')+'</td>'
        +'<td class="num">'+thrCell(ra&&ra.thr, rb&&rb.thr)+'</td>'
        +'<td class="num">'+fmt(ra&&ra.mean)+'</td><td class="num">'+fmt(rb&&rb.mean)+'</td>'
        +'<td class="num">'+fmt(ra&&ra.peak)+'</td><td class="num">'+fmt(rb&&rb.peak)+'</td>'
        +'<td class="num">'+(ra?(ra.exceed_rate*100).toFixed(1)+'%':'—')+'</td>'
        +'<td class="num">'+(rb?(rb.exceed_rate*100).toFixed(1)+'%':'—')+'</td>'
        +'<td>'+jdg(ra)+'</td><td>'+jdg(rb)+'</td><td>'+chg(ra,rb)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  if (!lvKeys.length && !plist.length)
    h += '<div class="muted">无阈值数据（缺少或无法解析 all_memory_data.xls）</div>';
  h += '</div>';
  const meta = DATA.meta;
  h += '<div class="card">'+cardHd('疑似泄漏','趋势回归，提示非定论 · 常驻≥'+meta.resident
    +' · delta≥max('+meta.leak_delta+' MB, head×'+meta.leak_pct+'%) · R²≥'+meta.leak_r2
    +' · 层级/整机 delta≥'+meta.sys_leak_delta+' MB');
  if (DATA.leaks.length){
    h += '<div class="tbl-wrap"><table><thead><tr><th>数据集</th><th>类型</th><th>口径</th><th>对象</th><th class="num">head</th><th class="num">tail</th><th class="num">delta</th><th class="num">斜率/h</th><th class="num">R²</th></tr></thead><tbody>'
      + DATA.leaks.map(lk=>'<tr><td>'+lk.ds+'</td><td>'+esc(lk.kind)+'</td><td>'+esc(lk.metric.toUpperCase()||'—')+'</td><td class="name">'+(lk.kind==='proc'?procLink(lk.name):esc(lk.name))+'</td><td class="num">'+fmt(lk.head)+'</td><td class="num">'+fmt(lk.tail)+'</td><td class="num">'+(lk.delta>0?'+':'')+fmt(lk.delta)+'</td><td class="num">'+(lk.slope>0?'+':'')+fmt(lk.slope)+'</td><td class="num">'+fmt(lk.r2)+'</td></tr>').join('')
      +'</tbody></table></div>';
  } else h += '<div class="muted">未发现疑似泄漏项。</div>';
  h += '</div>';
  const fs = DATA.findings.filter(f=>includeCached||!f.cached);
  const hidden = DATA.findings.length - fs.length;
  h += '<div class="card">'+cardHd('自动结论（'+fs.length+'）','按严重度排序'+(hidden?' · 已隐藏 '+hidden+' 条 Cached 相关':''))
    +'<div class="tbl-wrap"><table><thead><tr><th>级别</th><th>类别</th><th>标题</th><th>详情</th></tr></thead><tbody>'
    + (fs.map(f=>'<tr><td>'+sevBadge(f.sev)+'</td><td>'+esc(f.cat)+'</td><td class="name"><a href="'+esc(f.link)+'">'+esc(f.title)+'</a></td><td class="name">'+esc(f.detail)+'</td></tr>').join('')
      || '<tr><td colspan="4" class="muted">无自动结论</td></tr>')
    +'</tbody></table></div></div>';
  el.innerHTML = h;
};

/* ============ 10. Markdown 报告 ============ */
function mdToHtml(md){
  const lines = md.split('\n');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html='', i=0;
  const parseRow = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  while (i<lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l)){
      const rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const head=parseRow(rows[0]);
      const body=rows.slice(2).map(parseRow);
      html += '<div class="tbl-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        + body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;
    }
    let mm;
    if ((mm=l.match(/^###\s+(.*)/))){html+='<h3>'+inline(mm[1])+'</h3>';i++;continue;}
    if ((mm=l.match(/^##\s+(.*)/))){html+='<h2>'+inline(mm[1])+'</h2>';i++;continue;}
    if ((mm=l.match(/^#\s+(.*)/))){html+='<h1>'+inline(mm[1])+'</h1>';i++;continue;}
    if (/^\s*\-\s+/.test(l)){
      html+='<ul>';
      while(i<lines.length && /^\s*\-\s+/.test(lines[i])){html+='<li>'+inline(lines[i].replace(/^\s*\-\s+/,''))+'</li>';i++;}
      html+='</ul>';continue;
    }
    if (l.trim()===''){i++;continue;}
    html+='<p>'+inline(l)+'</p>';i++;
  }
  return html;
}
RENDER.report = function(){
  const el = document.getElementById('page-report');
  const md = DATA.report_md || '';
  el.innerHTML = '<div class="card">'+cardHd('Markdown 报告','与 report.md 内容一致',
      '<button class="btn ghost" id="mdToggle">'+(state.mdRaw?'查看渲染效果':'查看原始 Markdown')+'</button>')
    +(state.mdRaw ? '<div class="mdraw">'+esc(md)+'</div>' : '<div class="mdview">'+mdToHtml(md)+'</div>')
    +'</div>';
  document.getElementById('mdToggle').onclick = ()=>{state.mdRaw=!state.mdRaw;RENDER.report();};
};

/* ============ 进程详情 ============ */
function distRow(d){
  return '<td class="num">'+d.k+'/'+d.n+'</td><td class="num">'+Math.round(d.rate*100)+'%</td>'
    +'<td class="num">'+fmt(d.mi)+'</td><td class="num">'+fmt(d.mean)+'</td><td class="num">'+fmt(d.min)+'</td>'
    +'<td class="num">'+fmt(d.p50)+'</td><td class="num">'+fmt(d.p90)+'</td><td class="num">'+fmt(d.p95)+'</td><td class="num">'+fmt(d.max)+'</td>';
}
function trendRow(t){
  if (!t) return '<td colspan="5" class="muted">出现轮数不足，不判定</td>';
  return '<td class="num">'+fmt(t.head)+'</td><td class="num">'+fmt(t.tail)+'</td><td class="num">'+(t.delta>0?'+':'')+fmt(t.delta)+'</td><td class="num">'+(t.slope>0?'+':'')+fmt(t.slope)+'</td><td class="num">'+fmt(t.r2)+'</td>';
}
function openProc(name){
  const ov = document.getElementById('procOverlay');
  ov.classList.add('open');
  const inner = document.getElementById('procInner');
  const p = MV().procs[name];
  if (!p){
    inner.innerHTML = '<button class="btn ghost" id="procBack">返回</button><div class="card">当前指标（'+metric.toUpperCase()+'）下无进程 <b>'+esc(name)+'</b></div>';
    document.getElementById('procBack').onclick = ()=>setHash({proc:null, tab:state.tab});
    return;
  }
  const dc = deltaCls(p.gap, false, p.gapt);
  const tA = metric==='rss' ? _thrProc.a[name] : null;
  const tB = metric==='rss' ? _thrProc.b[name] : null;
  const hasEv = DS[0].events && DS[1].events;
  let h = '<button class="btn ghost" id="procBack">返回 '+(PAGES[state.tab]||'')+'</button>'
    +'<div class="pd-head"><div class="pd-titlerow"><h2>'+esc(name)+'</h2>'
    +'<span class="segtrack" id="pdMetric"><button class="seg'+(metric==='pss'?' active':'')+'" data-m="pss">PSS</button><button class="seg'+(metric==='rss'?' active':'')+'" data-m="rss">RSS</button></span>'
    +'</div><div>'+procTags(p)+'<span class="tag tag-m">'+metric.toUpperCase()+'</span>'
    +(tA!=null||tB!=null?'<span class="tag tag-m">阈值 A '+fmt(tA,0)+' / B '+fmt(tB,0)+' MB</span>':'')+'</div></div>'
    +'<div class="pd-stats">'
    +'<div class="stat"><div class="t">A 轮均</div><div class="v" style="color:var(--c-a)">'+fmt(p.da.mi)+'<span class="uu"> MB</span></div></div>'
    +'<div class="stat"><div class="t">B 轮均</div><div class="v" style="color:var(--c-b)">'+fmt(p.db.mi)+'<span class="uu"> MB</span></div></div>'
    +'<div class="stat"><div class="t">GAP</div><div class="v">'+(p.gap==null?'<span class="muted">—</span>':deltaBadge((p.gap>0?'+':'')+fmt(p.gap)+' MB', dc, p.gap))+'</div></div>'
    +'<div class="stat"><div class="t">GAP%</div><div class="v">'+(p.gapp==null&&p.gapt==null?'<span class="muted">—</span>':deltaBadge(p.gapt||(p.gapp>0?'+':'')+(p.gapp==null?'—':p.gapp.toFixed(1))+'%', dc, p.gap))+'</div></div>'
    +'</div>'
    +'<div class="card">'+cardHd('逐轮走势','x=轮次 · 实线=A '+LA+'，虚线=B '+LB+' · '+metric.toUpperCase()+' (MB) · 点击数据点可多选')+'<div id="pdChart" class="chart"></div></div>'
    +'<div class="card">'+cardHd('已选数据点','','<button class="btn ghost" id="pdSelClear">清空选择</button>')
    +'<div id="pdSelBody"></div></div>'
    +'<div class="grid2">'
    +'<div class="card">'+cardHd('分布统计','出现轮口径')+'<div class="tbl-wrap no-max"><table><thead><tr><th></th><th class="num">出现</th><th class="num">出现率</th><th class="num">轮均</th><th class="num">值均</th><th class="num">最小</th><th class="num">P50</th><th class="num">P90</th><th class="num">P95</th><th class="num">最大</th></tr></thead><tbody>'
    +'<tr><td><b>A</b></td>'+distRow(p.da)+'</tr><tr><td><b>B</b></td>'+distRow(p.db)+'</tr>'
    +'</tbody></table></div></div>'
    +'<div class="card">'+cardHd('趋势','线性回归 · head/tail=前/后10%中位')+'<div class="tbl-wrap no-max"><table><thead><tr><th></th><th class="num">head</th><th class="num">tail</th><th class="num">delta</th><th class="num">斜率/h</th><th class="num">R²</th></tr></thead><tbody>'
    +'<tr><td><b>A</b></td>'+trendRow(p.ta)+'</tr><tr><td><b>B</b></td>'+trendRow(p.tb)+'</tr>'
    +'</tbody></table></div></div></div>'
    +'<div class="card">'+cardHd('层级出现分布','进程在各层级出现的轮数')+'<div class="tbl-wrap no-max"><table><thead><tr><th>层级</th><th class="num">A 轮数</th><th class="num">B 轮数</th></tr></thead><tbody>'
    + (()=>{const ls=new Set([...Object.keys(p.lvc_a),...Object.keys(p.lvc_b)]);return [...ls].map(l=>'<tr><td><span class="pill"><i style="background:'+lvColor(l)+'"></i>'+esc(l)+'</span></td><td class="num">'+(p.lvc_a[l]||0)+'</td><td class="num">'+(p.lvc_b[l]||0)+'</td></tr>').join('')||'<tr><td colspan="3" class="muted">无</td></tr>';})()
    +'</tbody></table></div></div>';
  // 逐轮明细（轮次 ≤30 时可用）
  if (p.pra!=null || p.prb!=null){
    h += '<div class="card">'+cardHd('逐轮明细','')
      +'<div class="tbl-wrap"><table><thead><tr><th>轮次</th><th>A 层级</th><th class="num">A '+metric.toUpperCase()+' (MB)</th><th>B 层级</th><th class="num">B '+metric.toUpperCase()+' (MB)</th></tr></thead><tbody>';
    const nR = Math.max(N(0),N(1));
    const pra = p.pra||[], prb = p.prb||[], ta = p.a||[], tb = p.b||[];
    for(let r=0;r<nR;r++){
      const la=pra[r], lb=prb[r];
      h += '<tr><td>第'+(r+1)+'轮</td><td>'+(la?'<span class="pill"><i style="background:'+lvColor(la)+'"></i>'+esc(la)+'</span>':'<span class="muted">—</span>')+'</td><td class="num">'+fmt(ta[r])+'</td>'
        +'<td>'+(lb?'<span class="pill"><i style="background:'+lvColor(lb)+'"></i>'+esc(lb)+'</span>':'<span class="muted">—</span>')+'</td><td class="num">'+fmt(tb[r])+'</td></tr>';
    }
    h += '</tbody></table></div></div>';
  }
  // 相关事件（仅当事件明细内嵌时）
  if (hasEv){
    h += '<div class="card">'+cardHd('相关事件','含该进程启动/消亡，及作为调用方拉起其他进程')
      +'<div class="tbl-wrap"><table><thead><tr><th>数据集</th><th>时间</th><th>阶段</th><th>类型</th><th>进程</th><th>原因</th><th>组件</th><th>调用方</th></tr></thead><tbody>';
    let any=false;
    DS.forEach((d,i)=>d.events.forEach(e=>{
      if (e.proc!==name && e.caller!==name) return;
      any=true;
      h += '<tr'+(e.phase==='boot'?' class="phaseboot"':'')+'><td>'+(i?'B':'A')+'</td><td class="mono">'+esc(e.t.slice(5))+'</td><td>'+esc(e.phase)+'</td><td>'+esc(e.kind)+'</td><td>'+esc(e.proc||'')+'</td><td>'+esc(e.reason||'')+'</td><td class="mono comp">'+esc(e.comp||'')+'</td><td>'+esc(e.caller||'')+'</td></tr>';
    }));
    h += (any?'':'<tr><td colspan="8" class="muted">无相关事件</td></tr>')+'</tbody></table></div></div>';
  }
  inner.innerHTML = h;
  document.getElementById('procBack').onclick = ()=>setHash({proc:null, tab:state.tab});
  const pdm = document.getElementById('pdMetric');
  if (pdm) pdm.querySelectorAll('.seg').forEach(b=>b.onclick=()=>setHash({metric:b.dataset.m}));
  /* ---- 逐轮走势：x=轮次（数值轴），点击散点选择 ---- */
  if (!state.pdSel || state.pdSel.name!==name) state.pdSel = {name, items:[]};
  const pdSel = state.pdSel;
  const srs = i => (i ? p.b : p.a) || [];
  const pdPts = i => {
    const R = DS[i].rounds, out = [];
    let lastR = null;
    srs(i).forEach((v,k)=>{
      const r = R[k];
      if (v==null) return;
      if (lastR!=null && r>lastR+1) out.push([lastR+0.5, null]);
      out.push({value:[r,v], k});
      lastR = r;
    });
    return out;
  };
  const allR = DS[0].rounds.concat(DS[1].rounds);
  const minR = Math.min(...allR), maxR = Math.max(...allR), span = maxR - minR;
  const tip = ps => {
    let hh = '';
    ps.forEach(pp=>{
      const d = pp.data||{};
      if (d.k==null) return;
      const i = pp.seriesIndex===0?0:1;
      if (!hh) hh = '第 '+DS[i].rounds[d.k]+' 轮<br>';
      hh += (pp.marker||'')+esc(pp.seriesName)+' <b>'+fmt(d.value[1])+'</b>'
        +' <span class="muted">'+esc(DS[i].start_times[d.k]||'')+' t+'+fmt(DS[i].hours[d.k])+'h</span><br>';
    });
    return hh;
  };
  const lvAt = (lvr,k)=>{
    if (!lvr) return null;
    let cur=null;
    for (const e of lvr){ if (e[0]<=k) cur=e[1]; else break; }
    return cur;
  };
  const buildSeries = ()=>{
    const sA = {name:'A '+LA,type:'line',data:pdPts(0),itemStyle:{color:CA},
                lineStyle:{color:CA,width:2},showSymbol:span<=60,symbolSize:6,connectNulls:false,z:3};
    const sB = {name:'B '+LB,type:'line',data:pdPts(1),itemStyle:{color:CB},
                lineStyle:{color:CB,width:2,type:'dashed'},showSymbol:span<=60,symbolSize:6,connectNulls:false,z:3};
    const ml = thrMarkLine([{y:tA,n:'A阈 '+fmt(tA,0),c:CA},{y:tB,n:'B阈 '+fmt(tB,0),c:CB}]);
    if (ml) sA.markLine = ml;
    const sel = {name:'__sel',type:'scatter',z:9,symbolSize:14,
      data:pdSel.items.map((it,idx)=>{
        const v = srs(it.side)[it.k];
        return {value:[it.round,v], it:idx,
          itemStyle:{color:'#fff',borderColor:it.color,borderWidth:3},
          label:{show:true,position:'top',formatter:String(idx+1),color:it.color,fontWeight:600,fontSize:11}};
      })};
    sA.id = 'pdA'; sB.id = 'pdB'; sel.id = 'pdSel';
    return [sA,sB,sel];
  };
  const chart = makeChart(document.getElementById('pdChart'));
  chart.setOption({
    tooltip:{trigger:'axis',formatter:tip},
    legend:{top:0,data:['A '+LA,'B '+LB]},
    grid:{top:40,left:66,right:20,bottom:span>30?58:30},
    xAxis:{type:'value',minInterval:1,min:minR,max:maxR,interval:span<=30?1:null},
    yAxis:{type:'value',name:'MB',scale:true},
    dataZoom:[{type:'inside'}].concat(span>30?[{type:'slider',height:18,bottom:8}]:[]),
    series:buildSeries()});
  const drawSelBody = ()=>{
    const body = document.getElementById('pdSelBody');
    if (!pdSel.items.length){
      body.innerHTML = '<div class="empty">点击图中的数据点查看该轮明细，可多选；再次点击同一点取消。</div>';
      return;
    }
    const prs = DATA.metrics.rss.procs[name]||{}, pps = DATA.metrics.pss.procs[name]||{};
    let rows = pdSel.items.map((it,idx)=>{
      const i = it.side, k = it.k;
      const pss = pps[i?'b':'a']||[], rss = prs[i?'b':'a']||[], sw = prs['sw'+(i?'b':'a')]||[];
      const mlv = lvAt(p['lvr_'+(i?'b':'a')], k);
      const olv = lvAt((metric==='rss'?prs:pps)===p ? p['lvr_'+(i?'b':'a')] : p['lvr_'+(i?'b':'a')], k);
      void olv;
      const otherP = metric==='rss' ? pps : prs;
      const oLevel = lvAt(otherP['lvr_'+(i?'b':'a')], k);
      const lvTxt = (oLevel && oLevel!==mlv)
        ? (metric==='rss'?'RSS: ':'PSS: ')+esc(mlv||'—')+' / '+(metric==='rss'?'PSS: ':'RSS: ')+esc(oLevel)
        : (mlv?'<span class="pill"><i style="background:'+lvColor(mlv)+'"></i>'+esc(mlv)+'</span>':'—');
      let prev = null;
      const cur = srs(i)[k];
      for (let j=k-1;j>=0;j--){ if (srs(i)[j]!=null){ prev=srs(i)[j]; break; } }
      const d = (cur!=null && prev!=null) ? cur-prev : null;
      const dHtml = d==null ? '—' : '<span style="color:'+(d>0?'var(--red)':'var(--green)')+'">'+(d>0?'+':'')+fmt(d)+'</span>';
      return '<tr><td><span class="pill"><i style="background:'+it.color+'"></i>'+(idx+1)+'</span></td>'
        +'<td><span class="sc sc-'+(i?'b':'a')+'">'+(i?'B':'A')+'</span>'+esc(DS[i].label)+'</td>'
        +'<td class="name">'+esc(name)+'</td><td>第 '+it.round+' 轮</td>'
        +'<td class="mono">'+esc(DS[i].start_times[k]||'—')+'</td><td>'+lvTxt+'</td>'
        +'<td class="num">'+fmt(pss[k])+'</td><td class="num">'+fmt(rss[k])+'</td><td class="num">'+fmt(sw[k])+'</td>'
        +'<td class="num">'+dHtml+'</td><td><button class="btn ghost" data-rm="'+idx+'">移除</button></td></tr>';
    }).join('');
    body.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>版本</th><th>进程</th><th>轮次</th><th>采集时间</th><th>层级</th><th class="num">PSS (MB)</th><th class="num">RSS (MB)</th><th class="num">Swap (MB)</th><th class="num">较上一轮</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      pdSel.items.splice(+b.dataset.rm,1); refreshSel();
    });
  };
  const refreshSel = ()=>{
    chart.setOption({series:[buildSeries()[2]]});
    drawSelBody();
  };
  document.getElementById('pdSelClear').onclick = ()=>{ pdSel.items.length=0; refreshSel(); };
  chart.getZr().off('click');
  chart.getZr().on('click', ev=>{
    if (!ev.target || ev.target.topmost) {/* 点击散点也算 */}
    const px = [ev.offsetX, ev.offsetY];
    let xr;
    try { xr = chart.convertFromPixel({xAxisIndex:0}, px[0]); } catch(e){ return; }
    if (xr==null || isNaN(xr)) return;
    let best = null;
    [0,1].forEach(i=>{
      pdPts(i).forEach(pt=>{
        if (pt.k==null) return;
        const r = pt.value[0];
        if (Math.abs(r-xr)>3) return;
        try{
          const pp = chart.convertToPixel({xAxisIndex:0,yAxisIndex:0}, pt.value);
          const d = Math.hypot(pp[0]-px[0], pp[1]-px[1]);
          if (d<=24 && (!best || d<best.d)) best = {side:i, k:pt.k, round:r, d};
        }catch(e){}
      });
    });
    if (!best) return;
    const ix = pdSel.items.findIndex(it=>it.side===best.side && it.round===best.round);
    if (ix>=0){ pdSel.items.splice(ix,1); }
    else {
      const used = new Set(pdSel.items.map(it=>it.color));
      const c = SEL_PALETTE.find(c=>!used.has(c)) || SEL_PALETTE[pdSel.items.length%SEL_PALETTE.length];
      pdSel.items.push({side:best.side, k:best.k, round:best.round, color:c});
    }
    refreshSel();
  });
  drawSelBody();
  ov.scrollTop = 0;
}

route();
