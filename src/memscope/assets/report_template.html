<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --c-a:#3b82f6; --c-b:#f59e0b;
  --bg:#f5f7fb; --card:#fff; --line:#e6eaf2; --line-soft:#eef2f7;
  --txt:#0f172a; --sub:#64748b; --brand:#0f172a; --brand-soft:#f1f5f9;
  --red:#e11d48; --red-soft:#fff1f2; --green:#059669; --green-soft:#ecfdf5;
  --font:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:var(--txt);text-decoration:underline;text-decoration-color:#cbd5e1;text-underline-offset:3px}
a:hover{text-decoration-color:var(--txt)}
a[href^="#proc="]{font-weight:500}

/* ---------- 顶栏 ---------- */
#topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-row{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:#0f172a;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.bar-row h1{font-size:16px;margin:0;white-space:nowrap;font-weight:600}
.bar-row h1 .sub{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:4px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip-a .dot{background:var(--c-a)}
.chip-b .dot{background:var(--c-b)}
.chip b{font-weight:600;color:var(--txt)}
.toggles{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub)}
.segtrack{display:flex;background:#f1f5f9;border-radius:999px;padding:3px}
.seg{border:none;background:transparent;padding:4px 16px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--sub);font-family:var(--font)}
.seg.active{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(16,24,40,.14);font-weight:500}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--sub);user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{width:36px;height:20px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .15s;flex:none}
.switch .sl::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.sl{background:var(--brand)}
.switch input:checked+.sl::after{transform:translateX(16px)}
#tabnav{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
#tabnav button{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;position:relative;font-family:var(--font)}
#tabnav button:hover{color:var(--txt);background:#f6f8fc}
#tabnav button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:transparent}
#tabnav button.active{color:var(--brand);font-weight:600}
#tabnav button.active::after{background:var(--brand)}

/* ---------- 布局 / 卡片 ---------- */
main{max-width:1400px;margin:0 auto;padding:20px 20px 48px}
.tab-page{display:none}
.tab-page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-hd h3{margin:0;font-size:15px;font-weight:600}
.card-hd .sub{font-size:12px;color:var(--sub);font-weight:400;margin-top:3px}
.card-hd-r{display:flex;gap:8px;align-items:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0}
.row-2col{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.row-2col>*{min-width:0}
.row-2col .card{margin-bottom:0}
@media(max-width:1000px){.row-2col{grid-template-columns:1fr}}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(min-width:1200px){.grid-kpi:not(.auto){grid-template-columns:repeat(5,1fr)}}
@media(max-width:999px){.grid-kpi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-kpi{grid-template-columns:1fr}}
.grid-kpi.auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi-name{font-size:13px;font-weight:600}
.kpi-src{font-size:11px;color:var(--sub)}
.kpi-v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-v .u{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.kpi-ab{font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-ab .arr{color:var(--sub);margin:0 5px}
.kpi-delta{margin-top:7px}
.spark{display:block;width:100%;height:36px;margin-top:8px}

/* ---------- delta 徽标 / 标签 / 状态 ---------- */
.delta{display:inline-flex;align-items:center;gap:2px;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.bad{background:var(--red-soft);color:var(--red)}
.delta.good{background:var(--green-soft);color:var(--green)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;margin:0 4px 2px 0;font-weight:500}
.tag-a{background:#eff6ff;color:#1d4ed8}
.tag-b{background:#fffbeb;color:#b45309}
.tag-lv{background:#f5f3ff;color:#6d28d9}
.tag-ih{background:var(--green-soft);color:#047857}
.tag-sig{background:var(--red-soft);color:#be123c}
.tag-cached{background:#f1f5f9;color:#64748b}
.tag-gg{background:#e8f0fe;color:#1a73e8}
.tag-m{background:none;color:#64748b;padding:0;margin-right:10px;font-weight:400}
.st{display:inline-block;padding:1px 10px;border-radius:4px;font-size:12px;font-weight:500}
.st-ok{background:var(--green-soft);color:var(--green)}
.st-bad{background:var(--red-soft);color:var(--red)}
.sc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 9px;border-radius:4px;background:#f1f5f9;color:#475569;margin-right:6px;vertical-align:1px}
.sc::before{content:'';width:6px;height:6px;border-radius:50%}
.sc-a::before{background:var(--c-a)}
.sc-b::before{background:var(--c-b)}
.cnt{display:inline-block;min-width:20px;text-align:center;background:#f1f5f9;color:#0f172a;border-radius:4px;font-size:11px;font-weight:600;padding:1px 7px;margin-left:6px}
.gap-pos{color:var(--red);font-weight:600}
.gap-neg{color:var(--green);font-weight:600}
.muted{color:var(--sub)}
.sec-h{font-size:13px;font-weight:600;margin-bottom:8px}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.tbl-wrap.no-max{max-height:none}
.tbl-wrap.h320{max-height:320px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;text-align:left;height:40px}
th{position:sticky;top:0;background:#f8fafc;color:var(--sub);font-size:12px;font-weight:600;z-index:2;height:auto}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name{white-space:normal;word-break:break-all;min-width:220px;max-width:420px}
td.bv{font-weight:600}
tbody tr:hover td{background:#f8faff}
tr.lvl-row td{cursor:pointer;background:#f6f8fe;font-weight:600}
tr.lvl-row td:first-child{position:relative;padding-left:30px}
tr.lvl-row td:first-child::before{content:'›';position:absolute;left:13px;top:50%;margin-top:-10px;font-size:15px;color:var(--sub);display:inline-block;transform:rotate(0);transition:transform .15s}
tr.lvl-row.open td:first-child::before{transform:rotate(90deg)}
tr.proc-row td{font-weight:400}
tr.proc-row td:first-child{padding-left:30px}
tr.diff td{background:#f8fafc}
tr.diff td:first-child{box-shadow:inset 3px 0 0 #475569}
tr.viol td{background:var(--red-soft)}
tr.viol td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.phaseboot td{color:var(--sub);background:#fafbfc}

/* ---------- 控件 ---------- */
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--sub)}
.controls label{display:inline-flex;align-items:center;gap:6px}
input[type=text],input[type=number],select{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;background:#fff;color:var(--txt);font-family:var(--font)}
input[type=number]{width:84px}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,23,42,.12)}
input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.btn{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 14px;font-size:13px;background:#fff;color:var(--txt);cursor:pointer;font-family:var(--font)}
.btn:hover{border-color:#c7cfdd;background:#f8fafc}
.btn.ghost{background:#fff}
.btn:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,23,42,.12)}
#tabnav button:focus-visible,.seg:focus-visible,.btn:focus-visible,a:focus-visible,.switch input:focus-visible+.sl{outline:2px solid #0f172a;outline-offset:2px}
.btn:focus-visible{box-shadow:none}

/* ---------- 多选选择器 ---------- */
.mp{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 8px;min-height:44px;margin-bottom:12px}
.mp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,23,42,.12)}
.mp-chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;color:#0f172a;border-radius:4px;padding:3px 6px 3px 10px;font-size:12px;font-weight:500}
.mp-chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mp-chip b{cursor:pointer;color:#475569;font-weight:600;padding:0 4px;line-height:1}
.mp-chip b:hover{color:var(--red)}
.mp-input{flex:1;min-width:150px;border:none;outline:none;height:28px;font-size:13px;background:transparent;color:var(--txt);font-family:var(--font);padding:0 4px}
.mp-clear{border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:2px 6px;font-family:var(--font)}
.mp-clear:hover{color:var(--red)}
.mp-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);z-index:60;display:none}
.mp-menu.open{display:block}
.mp-it{padding:7px 12px;font-size:13px;cursor:pointer}
.mp-it:hover{background:#f8faff}
.mp-it.muted{cursor:default}
.mp-it.muted:hover{background:none}

/* ---------- 图表 / 其它 ---------- */
.chart{width:100%;height:340px}
.chart-tall{height:460px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
.strip{display:flex;gap:2px;align-items:center;margin:3px 0;flex-wrap:wrap}
.strip .cell{width:18px;height:14px;border-radius:4px;display:inline-block}
.strip .cell.empty{background:#f1f5f9;border:1px dashed #cbd5e1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0 10px}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.pkg-cols{display:grid;gap:14px}
.mono-list{list-style:none;margin:8px 0 0;padding:0;font-family:Consolas,"Courier New",monospace;font-size:12px;max-height:200px;overflow:auto}
.mono-list li{padding:3px 0;border-bottom:1px dashed var(--line-soft);word-break:break-all}
ul.findings{list-style:none;margin:0;padding:0}
ul.findings li{position:relative;padding-left:16px;margin:10px 0;line-height:1.6;overflow-wrap:anywhere}
ul.findings li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:#cbd5e1}
details.info{border:1px solid var(--line);background:#fbfcfe;border-radius:8px;margin-bottom:16px;font-size:12.5px;color:var(--sub)}
details.info summary{cursor:pointer;padding:9px 14px;font-weight:500;list-style:none;display:flex;align-items:center;user-select:none}
details.info summary::-webkit-details-marker{display:none}
details.info summary::before{content:'ⓘ';color:var(--sub);margin-right:7px}
details.info summary::after{content:'▸';margin-left:auto;color:#94a3b8;transition:transform .15s}
details.info[open] summary::after{transform:rotate(90deg)}
details.info .info-body{padding:10px 14px;border-top:1px dashed var(--line);line-height:1.6}
details.info .info-body code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace}
.warn{position:relative;background:var(--red-soft);border:1px solid #fecdd3;color:#9f1239;border-radius:8px;padding:10px 14px 10px 34px;font-size:13px;margin-bottom:16px;line-height:1.6}
.warn::before{content:'⚠';position:absolute;left:13px;top:10px}
.wake{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:10px;align-items:center;margin-top:10px}
.wake .mid{display:flex;align-items:center;background:#f1f5f9;color:#0f172a;border-radius:4px;padding:8px 18px;font-weight:600;font-size:13px;white-space:nowrap}
.wake .warr{color:#94a3b8;font-size:15px}
.wake .box{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;align-self:stretch}
.wake .box h5{margin:0 0 8px;font-size:12.5px;color:var(--sub);font-weight:600}
.wake .box ul{margin:0;padding-left:16px}
.wake .box li{margin:4px 0;line-height:1.5}
.pill{display:inline-flex;align-items:center;background:#f8fafc;border:1px solid var(--line-soft);border-radius:4px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
td.comp{white-space:normal;word-break:break-all;min-width:220px;max-width:380px}
.hint{position:relative;display:inline-flex;align-items:center;color:var(--sub);font-size:15px;cursor:help;margin-left:2px;outline:none}
.hint-pop{position:absolute;top:calc(100% + 8px);right:-8px;width:320px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:10px 12px;font-size:12px;line-height:1.6;color:var(--sub);display:none;z-index:80;font-weight:400;white-space:normal;cursor:default}
.hint:hover .hint-pop,.hint:focus-within .hint-pop{display:block}
.hint-pop p{margin:0 0 6px}
.hint-pop p:last-child{margin:0}
tr.lv-off td{color:var(--sub)}
#procOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow:auto;display:none}
#procOverlay.open{display:block}
#procOverlay .inner{max-width:1400px;margin:0 auto;padding:20px}
.pd-head{margin:14px 0 14px}
.pd-head h2{font-size:20px;margin:0 0 8px;word-break:break-all;font-weight:600}
.pd-titlerow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pd-titlerow h2{margin:0}
.pd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:800px){.pd-stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat .t{font-size:12px;color:var(--sub);margin-bottom:5px}
.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v .uu{font-size:12px;color:var(--sub);font-weight:400}
.stat .v .delta{font-size:13px}
.mdraw{white-space:pre-wrap;font-family:Consolas,"Courier New",monospace;font-size:12.5px;background:#f8fafc;color:var(--txt);border:1px solid var(--line);padding:16px;border-radius:10px;overflow:auto;max-height:640px}
.mdview{max-width:980px}
.mdview h1{font-size:20px;margin:24px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mdview h2{font-size:17px;margin:22px 0 8px;border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.mdview h3{font-size:15px;margin:18px 0 6px}
.mdview p{margin:8px 0;line-height:1.7}
.mdview ul{margin:8px 0;padding-left:20px}
.mdview li{margin:4px 0}
.mdview .tbl-wrap{margin:10px 0}
.mdview code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12.5px}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:10px 0 0}

.sev{display:inline-block;padding:1px 9px;border-radius:4px;font-size:11px;font-weight:600;margin-right:6px}
.sev-high{background:#e11d48;color:#fff}
.sev-mid{background:#fff1f2;color:#be123c}
.sev-low{background:#f1f5f9;color:#475569}
.sev-info{background:transparent;color:#64748b;border:1px solid #e2e8f0}
th.sort:hover{background:#f1f5f9}
.pname{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname a{display:block;overflow:hidden;text-overflow:ellipsis}
.lvcell{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 10px;color:var(--sub);font-size:13px;text-align:center}

/* ---------- 判定块（概览顶部） ---------- */
.verdict{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.verdict h2{font-size:22px;font-weight:600;margin:0 0 12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.verdict h2 .go{font-size:13px;font-weight:400}
.vrow{display:flex;gap:10px;align-items:baseline;margin:6px 0;font-size:14px}
.vrow .vdot{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.vrow .vsub{font-size:13px;color:var(--sub);margin-left:19px;max-width:80ch}
.vdiv{border-top:1px solid var(--line-soft);margin:14px 0 10px}
.vfind{display:block;text-decoration:none;color:var(--txt);margin:4px 0}
.vfind:hover{text-decoration:none}
.vfind .ft{font-size:14px;font-weight:600}
.vfind .fd{font-size:13px;color:var(--sub);margin-left:52px;margin-top:2px}
.tag-a-t{color:#1d4ed8}.tag-b-t{color:#b45309}
.sm-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1100px){.sm-grid{grid-template-columns:repeat(2,1fr)}}
.sm-grid>*:only-child{grid-column:1/-1}
.sm-chart{height:240px}
.sm-hd{font-size:13px;font-weight:600;margin:0 0 4px}
.sm-hd .muted{font-weight:400}
@media(max-width:700px){
  .bar-row,.chip{padding:12px}
  main{padding:12px 12px 40px}
  .chip{display:flex;width:100%}
  .chip b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="topbar">
  <div class="bar-row">
    <div class="brand"><span class="logo">M</span><h1><span id="pageTitle"></span><span class="sub">memscope</span></h1></div>
    <div class="chips">
      <span class="chip chip-a"><i class="dot"></i>基线 A：<b id="chipA"></b></span>
      <span class="chip chip-b"><i class="dot"></i>对比 B：<b id="chipB"></b></span>
    </div>
    <div class="toggles">
      <span class="segtrack"><button class="seg" data-m="pss">PSS</button><button class="seg" data-m="rss">RSS</button></span>
      <label class="switch"><input type="checkbox" id="incCached"><span class="sl"></span><span>包含 Cached</span></label>

function gapCls(gap, reversed){
  if (gap==null || gap===0) return '';

function deltaCls(gap, reversed, gapt){

/* ---------- 迷你走势（sparkline，降采样至 ≤200 点） ---------- */
function _dsample(arr){
  if (!arr || arr.length<=200) return arr;
  const step = arr.length/200, out=[];
  for (let i=0;i<200;i++) out.push(arr[Math.floor(i*step)]);
  return out;
}
function sparkSvg(a, b, w, h){
  a=_dsample(a); b=_dsample(b);
  w=w||200; h=h||36;
  const all=[...(a||[]),...(b||[])].filter(v=>v!=null);
  if (!all.length) return '';
  const pad=2, n=Math.max((a||[]).length,(b||[]).length);
  const mn=Math.min(...all), mx=Math.max(...all), span=(mx-mn)||1;
  const segs=arr=>{
    const out=[]; let cur=[];
    (arr||[]).forEach((v,i)=>{
      if (v==null){ if(cur.length){out.push(cur);cur=[];} return; }
      const x = pad+(n<=1 ? (w-2*pad)/2 : i*(w-2*pad)/(n-1));
      const y = h-pad-(v-mn)/span*(h-2*pad);
      cur.push([x,y]);
    });
    if (cur.length) out.push(cur);
    return out;
  };
  const draw=(arr,stroke,dash)=>segs(arr).map(s=>{
    if (s.length===1) return '<circle cx="'+s[0][0].toFixed(1)+'" cy="'+s[0][1].toFixed(1)+'" r="1.8" fill="'+stroke+'"/>';
    return '<polyline points="'+s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+stroke+'" stroke-width="1.5"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  }).join('');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" width="100%" height="'+h+'">'
    +draw(a,CA)+draw(b,CB,'3,2')+'</svg>';
}

/* ---- 时间轴序列：axis='round' → 第N轮类目轴；'hour' → 距测试开始小时数 ---- */
function tsData(dsIdx, series){
  if (AXIS==='round')
    return (series||[]).map((v,i)=> v==null ? null
      : {value:v, r:DS[dsIdx].rounds[i], t:DS[dsIdx].start_times[i]});
  const H = DS[dsIdx].hours, R = DS[dsIdx].rounds, T = DS[dsIdx].start_times;
  const gapRs = (DS[dsIdx].gaps||[]).map(g=>g.round);
  const out = [];
  let lastX = null, lastR = null;
  (series||[]).forEach((v,i)=>{
    const x = H[i], r = R[i];
    if (v!=null){
      if (lastX!=null && gapRs.some(gr=> lastR<gr && r>=gr))
        out.push({value:[(lastX+x)/2,null]});
      out.push({value:[x,v], r, t:T[i]});
      lastX = x; lastR = r;
    }
  });
  return out;
}
function lineSeries(name, dsIdx, series, col, dash){
  const s = {name, type:'line', data:tsData(dsIdx,series),
    itemStyle:{color:col}, lineStyle:{color:col,type:dash?'dashed':'solid',width:1.5},
    showSymbol:AXIS==='round', symbolSize:5, connectNulls:false};
  if (AXIS!=='round') s.sampling='lttb';
  return s;
}
function abLine(dsIdx, series){
  const a = dsIdx===0;

}

                   : plat==='Pass' ? '<b style="color:var(--green)">Pass</b>' : esc(plat);
    const ver = st ? st.verdict : null;
    const verHtml = ver==='Fail' ? '<b style="color:var(--red)">Fail</b>'
                  : ver==='Pass' ? '<b style="color:var(--green)">Pass</b>' : '无阈值';
    const facts = '有效 '+d.n+' 轮，无效 '+d.failed_rounds.length+' 轮，'
      +fmt(d.hours_total,1)+' h（有效 '+fmt(d.valid_hours,1)+' h），重启 '+d.reboots.length+' 次';
    const basis = (d.platform.basis && d.platform.basis.length)
      ? d.platform.basis.join('；') : (d.platform.basis_note || '报告未提供超标明细');
    const k = st ? st.procs.filter(r=>r.viol).length : 0;
    const mb = st ? ('层级 + Free RAM 计入判定（超标：'+(st.fail_items.length?st.fail_items.join('、'):'无')+'）；进程超标 '+k+' 项不计入判定（见标准与风险）')
                  : '无阈值';
    vh += '<div class="vrow"><span class="vdot" style="background:'+(i?CB:CA)+'"></span>'
      +'<span><b>'+lab+'</b>&nbsp; '+esc(d.label)+'&nbsp;&nbsp;平台 '+platHtml+'&nbsp;&nbsp;memscope '+verHtml
      +'&nbsp;&nbsp;<span class="muted" style="font-size:13px">'+esc(facts)+'</span></span></div>'
      +'<div class="vsub">平台依据：'+esc(basis)+'</div>'
      +'<div class="vsub">memscope 依据：'+esc(mb)+'</div>';
  });
  vh += '<div class="vdiv"></div>';
  vh += fsv.slice(0,3).map(f=>'<a class="vfind" href="'+esc(f.link)+'"><span class="ft">'+sevBadge(f.sev)+esc(f.title)+'</span><div class="fd">'+esc(f.detail)+'</div></a>').join('')
     || '<div class="muted">无自动结论</div>';
  vh += '</div>';
  h += vh;
  // 关键指标（含迷你走势）
  const ev = DATA.events;
  h += '<div class="card">'+cardHd('关键指标',metric.toUpperCase()+' 轮均口径 · MB；LMK=次/小时')+'<div class="grid-kpi auto">';
  const lvNames = ['Native','System','Persistent','Visible'];
  lvNames.forEach(lv=>{
    const r = lvRow(lv); if(!r) return;
    h += kpiCard(lv+' '+metric.toUpperCase(), '层级轮均', r.da.mi, r.db.mi, 'MB', false, 2, sparkSvg(r.a, r.b));
  });
  const fr = sysRow('Free RAM'), ma = sysRow('MemAvailable'), ur = sysRow('Used RAM'), cp = sysRow('cached pss');
  if (fr) h += kpiCard('Free RAM 值均', 'dumpsys tail · 高好', fr.da.mean, fr.db.mean, 'MB', true, 2, sparkSvg(fr.a, fr.b));
  const stA = DATA.standards.a, stB = DATA.standards.b;
  h += kpiCard('Free RAM P10', '下限阈值 '+(stB&&stB.free_ram?fmt(stB.free_ram.thr,0):'—'),
               stA&&stA.free_ram?stA.free_ram.p10:null, stB&&stB.free_ram?stB.free_ram.p10:null, 'MB', true);
  if (ma) h += kpiCard('MemAvailable', '/proc/meminfo · 高好', ma.da.mean, ma.db.mean, 'MB', true, 2, sparkSvg(ma.a, ma.b));
  if (ur) h += kpiCard('Used RAM 值均', 'dumpsys tail', ur.da.mean, ur.db.mean, 'MB', false, 2, sparkSvg(ur.a, ur.b));
  if (cp) h += kpiCard('cached pss', 'dumpsys tail', cp.da.mean, cp.db.mean, 'MB', false, 2, sparkSvg(cp.a, cp.b));
  h += kpiCard('LMK 次/小时', 'killinfo', ev.a.lmk.per_hour, ev.b.lmk.per_hour, '/h', false, 2,
               sparkSvg(ev.a.lmk.hourly, ev.b.lmk.hourly));
  h += kpiCard('ANR + crash', 'events_log', ev.a.anr.length+ev.a.crash.length,
               ev.b.anr.length+ev.b.crash.length, '次', false, 0);
  h += kpiCard('重启次数', 'uptime 回退', DS[0].reboots.length, DS[1].reboots.length, '次', false, 0);
  h += '</div></div>';
  // 自动结论 #4–#8（Top3 已在 .verdict；Cached 条目按开关过滤）
  const hidden = DATA.findings.length - fsv.length;
  h += '<div class="card">'+cardHd('自动结论','共 '+DATA.findings.length+' 条 · Top 3 见上方 · 全部见「标准与风险」页'+(hidden?' · 已隐藏 '+hidden+' 条 Cached 相关':''),
      '<a href="#tab=risk">全部结论</a>')
    + (fsv.slice(3,8).map(f=>'<a class="vfind" href="'+esc(f.link)+'"><span class="ft">'+sevBadge(f.sev)+esc(f.title)+'</span><div class="fd">'+esc(f.detail)+'</div></a>').join('')
      || '<div class="muted">无更多自动结论</div>')
    +'</div>';
  // 设备与测试信息 + 包差异
  const pd = DATA.pkg_diff;
  const diffs = DATA.device_diff.filter(r=>r.diff);
  const showAll = state.devAll || !diffs.length;
  h += '<div class="row-2col">'
    +'<div class="card">'+cardHd('设备与测试信息',
      diffs.length ? '差异 '+diffs.length+' / 共 '+DATA.device_diff.length+' 项' : '共 '+DATA.device_diff.length+' 项',
      diffs.length ? '<button class="btn ghost" id="devToggle">'+(showAll?'仅看差异':'显示全部 '+DATA.device_diff.length+' 项')+'</button>' : '')
    +'<div class="tbl-wrap"><table><thead><tr><th>字段</th><th>基线 A</th><th>对比 B</th></tr></thead><tbody>';
  (showAll ? DATA.device_diff : diffs).forEach(r=>{
    h += '<tr'+(r.diff?' class="diff"':'')+'><td>'+esc(r.field)+'</td><td>'+esc(r.a)+'</td><td'+(r.diff?' class="bv"':'')+'>'+esc(r.b)+'</td></tr>';
  });
  h += '</tbody></table></div></div>'
    +'<div class="card">'+cardHd('预装包差异','A '+DS[0].packages.length+' 个 / B '+DS[1].packages.length+' 个')
    +'<div class="pkg-cols">'
    +'<div><div class="sec-h">仅 A<span class="cnt">'+pd.a.length+'</span></div><ul class="mono-list">'+(pd.a.map(x=>'<li>'+esc(x)+'</li>').join('')||'<li class="muted">无</li>')+'</ul></div>'
    +'<div><div class="sec-h">仅 B<span class="cnt">'+pd.b.length+'</span></div><ul class="mono-list">'+(pd.b.map(x=>'<li>'+esc(x)+'</li>').join('')||'<li class="muted">无</li>')+'</ul></div>'
    +'</div></div></div>';
  el.innerHTML = h;
  const dt = document.getElementById('devToggle');
  if (dt) dt.onclick = ()=>{ state.devAll = !state.devAll; RENDER.overview(); };
};

/* ============ 2. 整机内存 ============ */
RENDER.system = function(){
  const el = document.getElementById('page-system');
  const defs = DATA.system;
  if (!defs.length){ el.innerHTML = '<div class="card"><div class="empty">本测试包无整机内存数据</div></div>'; return; }
  if (!state.sysSel) state.sysSel = ['Free RAM','MemAvailable','Used RAM','in swap'].filter(n=>defs.some(d=>d.name===n));
  state.sysSel = state.sysSel.filter(n=>defs.some(d=>d.name===n));
  let h = '<div class="card">'+cardHd('整机内存指标','值均 = 出现轮均值 / MB · 斜率 MB/h')+'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>指标</th><th>来源</th><th class="num">A 值均</th><th class="num">B 值均</th><th class="num">GAP</th><th class="num">GAP%</th>'
    +'<th class="num">A P90</th><th class="num">B P90</th><th class="num">A 最大</th><th class="num">B 最大</th>'
    +'<th class="num">斜率A (MB/h)</th><th class="num">斜率B (MB/h)</th><th>泄漏</th></tr></thead><tbody>';
  defs.forEach(d=>{
    h += '<tr><td>'+esc(d.name)+'</td><td class="muted">'+esc(d.src)+'</td><td class="num">'+fmt(d.da.mean)+'</td><td class="num">'+fmt(d.db.mean)+'</td>'
      + gapCells(d.da.mean||0, d.db.mean||0, d.gapt, d.gapp, d.hb)
      + '<td class="num">'+fmt(d.da.p90)+'</td><td class="num">'+fmt(d.db.p90)+'</td>'
      + '<td class="num">'+fmt(d.da.max)+'</td><td class="num">'+fmt(d.db.max)+'</td>'
      + '<td class="num">'+fmt(d.ta&&d.ta.slope)+'</td><td class="num">'+fmt(d.tb&&d.tb.slope)+'</td>'
      + '<td>'+(d.leak_a?'<span class="tag tag-sig">A</span>':'')+(d.leak_b?'<span class="tag tag-sig">B</span>':'')+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '<div class="card">'+cardHd('逐轮走势',(AXIS==='round'?'x=轮次':'x=测试小时')+' · 实线=A 虚线=B · 缩放联动')
    +'<div id="sysPick"></div><div class="sm-grid" id="sysCharts"></div></div>';
  el.innerHTML = h;
  const draw = ()=>{
    const wrap = document.getElementById('sysCharts');
    wrap.innerHTML = state.sysSel.map((t,idx)=>{
      const d = defs.find(x=>x.name===t); if(!d) return '';
      return '<div><div class="sm-hd">'+esc(t)+' <span class="muted">A 值均 '+fmt(d.da.mean)+' / B 值均 '+fmt(d.db.mean)+' MB</span></div>'
        +'<div class="sm-chart" id="sysC'+idx+'"></div></div>';
    }).join('');
    const last = wrap.querySelectorAll('.sm-chart').length - 1;
    const grp = 'sysGrp';
    wrap.querySelectorAll('.sm-chart').forEach((c,i)=>{
      const d = defs.find(x=>x.name===state.sysSel[i]); if(!d) return;
      const o = tsOption([abLine(0, d.a), abLine(1, d.b)]);
      o.legend = {show:false};
      o.grid.bottom = 30;
      if (i===last) o.dataZoom = [{type:'inside'},{type:'slider',height:18,bottom:8}];
      else o.dataZoom = [{type:'inside'}];
      const ch = makeChart(c);
      ch.group = grp;
      ch.setOption(o);
    });
    echarts.connect(grp);
  };
  multiPicker({el:document.getElementById('sysPick'), options:defs.map(d=>d.name), selected:state.sysSel,
    colorOf:(n,idx)=>PROC_PALETTE[idx%PROC_PALETTE.length],
    onChange:sel=>{state.sysSel=sel;draw();}, placeholder:'搜索添加指标…'});
  draw();
};

/* ============ 3. 层级内存 ============ */
RENDER.levels = function(){
  const el = document.getElementById('page-levels');
  const m = MV();
  if (!m.level_rows.length){ el.innerHTML = '<div class="card"><div class="empty">本测试包无层级内存数据</div></div>'; return; }
  const na = N(0), nb = N(1);
  if (!state.lvInit){
    state.lvInit = true;
    state.lvSel = ['Native'];
    state.lvDist = 'Native';
    let best=null,bg=-1;
    m.level_rows.filter(r=>includeCached||r.level!=='Cached').forEach(r=>{const g=Math.abs(r.gap);if(g>bg){bg=g;best=r.level;}});
    if (best) state.expanded.add(best);
  }
  state.lvSel = (state.lvSel||[]).filter(n=>m.level_rows.some(r=>r.level===n));
  if (!state.lvSel.length) state.lvSel = ['Native'];
  if (!m.level_rows.some(r=>r.level===state.lvDist)) state.lvDist = 'Native';
  // 层级→进程明细表（点击层级行展开）
  let h = '<div class="card">'+cardHd('层级内存对比',metric.toUpperCase()+' · 轮均 MB · 点击层级行展开进程；点击进程进详情')
    +'<div class="controls"><label>GAP 阈值(MB) <input type="number" id="lvGapMin" min="0" step="1" value="'+state.lvGapMin+'"></label></div>'
    +'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>层级 / 进程</th><th class="num">出现A</th><th class="num">出现B</th><th class="num">A 轮均</th><th class="num">B 轮均</th><th class="num">GAP</th><th class="num">GAP%</th>'
    +'<th class="num">A P50</th><th class="num">B P50</th><th class="num">A P90</th><th class="num">B P90</th><th class="num">P90差</th>'
    +'<th class="num">A 最大</th><th class="num">B 最大</th><th class="num">进程A/B</th>'
    +'<th class="num">阈值A</th><th class="num">阈值B</th><th>泄漏/显著</th></tr></thead><tbody id="lvBody"></tbody></table></div></div>';
  const chartRows = m.level_rows.filter(r=>includeCached||r.level!=='Cached');
  h += '<div class="card">'+cardHd('层级轮均对比',metric.toUpperCase()+(includeCached?'':'（不含 Cached，可在右上角开关纳入）'))+'<div id="lvBar" class="chart"></div></div>';
  h += '<div class="card">'+cardHd('层级时序',(AXIS==='round'?'x=轮次':'x=测试小时')+' · markLine=各侧阈值（RSS）')+'<div id="lvPick"></div><div id="lvChart" class="chart chart-tall"></div></div>';
  h += '<div class="card">'+cardHd('分布对比','P50/P90/P95/Max/Mean · <select id="lvDistSel" style="height:28px">'+m.level_rows.map(r=>'<option'+(r.level===state.lvDist?' selected':'')+'>'+esc(r.level)+'</option>').join('')+'</select>')
    +'<div id="lvDist" class="chart"></div></div>';
  el.innerHTML = h;
  const body = document.getElementById('lvBody');
  const fill = ()=>{
    let rows='';
    m.level_rows.forEach(r=>{
      const L = r.level;
      const off = !includeCached && L==='Cached';
      const open = state.expanded.has(L);
      const ta=_thrLv.a[L], tb=_thrLv.b[L];
      rows += '<tr class="lvl-row'+(open?' open':'')+(off?' lv-off':'')+'" data-lv="'+esc(L)+'">'
        +'<td><span class="pill"><i style="background:'+lvColor(L)+'"></i>'+esc(L)+'</span></td>'
        +'<td class="num"></td><td class="num"></td>'
        +'<td class="num">'+fmt(r.da.mi)+'</td><td class="num">'+fmt(r.db.mi)+'</td>'
        + gapCells(r.da.mi, r.db.mi, r.gapt, r.gapp)
        +'<td class="num">'+fmt(r.da.p50)+'</td><td class="num">'+fmt(r.db.p50)+'</td>'
        +'<td class="num">'+fmt(r.da.p90)+'</td><td class="num">'+fmt(r.db.p90)+'</td><td class="num">'+fmt(r.gap_p90)+'</td>'
        +'<td class="num">'+fmt(r.da.max)+'</td><td class="num">'+fmt(r.db.max)+'</td>'
        +'<td class="num">'+r.ca+'/'+r.cb+'</td>'
        +'<td class="num">'+(metric==='rss'?fmt(ta,0):'—')+'</td><td class="num">'+(metric==='rss'?fmt(tb,0):'—')+'</td>'
        +'<td>'+(r.leak_a?'<span class="tag tag-sig">泄A</span>':'')+(r.leak_b?'<span class="tag tag-sig">泄B</span>':'')+(r.sig?'<span class="tag tag-sig">显著</span>':'')+(off?'<span class="tag tag-cached">未纳入排行</span>':'')+'</td></tr>';
      if (open){
        const prows=[];
        for (const name in m.procs){
          const p = m.procs[name];
          const ka=p.lvc_a[L]||0, kb=p.lvc_b[L]||0;
          if (!ka && !kb) continue;
          const ra=p.lmi_a[L]||0, rb=p.lmi_b[L]||0;
          const va=ka? ra*na/ka : null, vb=kb? rb*nb/kb : null;
          const g = {gap:rb-ra, gapt: ra===0&&rb===0?null:(ra===0?'新增':rb===0?'消失':null), gapp:(ra!==0&&rb!==0)?(rb-ra)/ra*100:null};
          prows.push({p, ka, kb, ra, rb, va, vb, g});
        }
        prows.filter(r=>Math.abs(r.g.gap)>=state.lvGapMin)
             .sort((x,y)=>Math.abs(y.g.gap)-Math.abs(x.g.gap))
             .forEach(r=>{
          rows += '<tr class="proc-row"><td class="name">'+procLink(r.p.name)+'</td>'
            +'<td class="num">'+r.ka+'/'+na+'</td><td class="num">'+r.kb+'/'+nb+'</td>'
            +'<td class="num">'+fmt(r.ra)+'</td><td class="num">'+fmt(r.rb)+'</td>'
            + gapCells(r.ra,r.rb,r.g.gapt,r.g.gapp)
            +'<td colspan="10" class="muted">值均 A '+fmt(r.va)+' / B '+fmt(r.vb)+' MB</td>'
            +'<td>'+procTags(r.p)+'</td></tr>';
        });
      }
    });
    body.innerHTML = rows;
    body.querySelectorAll('tr.lvl-row').forEach(tr=>{
      tr.onclick = ()=>{ const L=tr.dataset.lv; state.expanded.has(L)?state.expanded.delete(L):state.expanded.add(L); fill(); };
    });
  };
  document.getElementById('lvGapMin').oninput = e=>{ state.lvGapMin=+e.target.value||0; fill(); };
  fill();
  // 轮均柱状图
  makeChart(document.getElementById('lvBar')).setOption({
    tooltip:{trigger:'axis'}, legend:{top:0,icon:'roundRect'},
    grid:{top:36,left:60,right:20,bottom:60},
    xAxis:{type:'category',data:chartRows.map(r=>r.level),axisLabel:{rotate:30}},
    yAxis:{type:'value',name:'MB'},
    series:[
      {name:'A '+LA, type:'bar', data:chartRows.map(r=>+r.da.mi.toFixed(2)), itemStyle:{color:CA}},
      {name:'B '+LB, type:'bar', data:chartRows.map(r=>+r.db.mi.toFixed(2)), itemStyle:{color:CB}}
    ]
  });
  // 层级时序
  const draw = ()=>{
    const series=[];
    const solo = state.lvSel.length===1;
    state.lvSel.forEach((lv,idx)=>{
      const r = m.level_rows.find(x=>x.level===lv); if(!r) return;
      const col = lvColor(lv);
      series.push(lineSeries(lv+'·A', 0, r.a, solo?CA:col, false));
      series.push(lineSeries(lv+'·B', 1, r.b, solo?CB:col, true));
      const tA=_thrLv.a[lv], tB=_thrLv.b[lv];
      const ml = (metric==='rss') ? thrMarkLine([{y:tA,n:lv+' A阈',c:CA},{y:tB,n:lv+' B阈',c:CB}]) : null;
      if (ml) series[series.length-2].markLine = ml;
    });
    makeChart(document.getElementById('lvChart')).setOption(tsOption(series));
  };
  multiPicker({el:document.getElementById('lvPick'), options:m.level_rows.map(r=>r.level), selected:state.lvSel,
    colorOf:(n)=>lvColor(n), onChange:sel=>{state.lvSel=sel;draw();}, placeholder:'搜索添加层级…'});
  draw();
  const drawDist = ()=>{
    const r = m.level_rows.find(x=>x.level===state.lvDist); if(!r) return;
    makeChart(document.getElementById('lvDist')).setOption({
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, legend:{top:0},
      grid:{top:36,left:66,right:20,bottom:30},
      xAxis:{type:'category',data:['P50','P90','P95','Max','Mean']},
      yAxis:{type:'value',name:'MB'},
      series:[
        {name:'A '+LA,type:'bar',data:[r.da.p50,r.da.p90,r.da.p95,r.da.max,r.da.mean].map(v=>v==null?null:+v.toFixed(2)),itemStyle:{color:CA}},
        {name:'B '+LB,type:'bar',data:[r.db.p50,r.db.p90,r.db.p95,r.db.max,r.db.mean].map(v=>v==null?null:+v.toFixed(2)),itemStyle:{color:CB}}]
    });
  };
  document.getElementById('lvDistSel').onchange = e=>{state.lvDist=e.target.value;drawDist();};
  drawDist();
};

/* ============ 4. 进程分析 ============ */

  let s='<div class="strip">';
  pr.forEach((lv,r)=>{
    s += lv ? '<span class="cell" style="background:'+lvColor(lv)+'" title="第'+(r+1)+'轮 '+esc(lv)+'"></span>'
            : '<span class="cell empty" title="第'+(r+1)+'轮 未出现"></span>';
  });
  return s+'</div>';
}

    +'</tbody></table></div>';
  h += '<div class="card">'+cardHd('独有进程','仅在单侧数据集中出现')+'<div class="grid2">'
    +'<div><div class="sec-h">仅 A 出现<span class="cnt">'+onlyA.length+'</span></div>'+utab(onlyA,0)+'</div>'
    +'<div><div class="sec-h">仅 B 出现<span class="cnt">'+onlyB.length+'</span></div>'+utab(onlyB,1)+'</div></div></div>';
  // 层级变化进程
  const hasPr = changed.length && changed[0].pra!=null;
  if (hasPr){
    const lvUsed = new Set(); changed.forEach(p=>{p.la.forEach(x=>lvUsed.add(x));p.lb.forEach(x=>lvUsed.add(x));});
    h += '<div class="card">'+cardHd('层级变化进程（'+changed.length+'）','每格一轮：A/B 各一条，空=未出现')
      +'<div class="legend">'+[...lvUsed].map(L=>'<span class="lg"><span class="sw" style="background:'+lvColor(L)+'"></span>'+esc(L)+'</span>').join('')+'<span class="lg"><span class="sw" style="background:#f1f5f9;border:1px dashed #cbd5e1"></span>未出现</span></div>'
      +'<div class="tbl-wrap"><table><thead><tr><th>进程</th><th>A 各轮层级</th><th>B 各轮层级</th><th>标签</th></tr></thead><tbody>'
      + changed.map(p=>'<tr><td class="name">'+procLink(p.name)+'</td><td>'+stripHtml(p.pra)+'</td><td>'+stripHtml(p.prb)+'</td><td>'+procTags(p)+'</td></tr>').join('')
      +'</tbody></table></div></div>';
  } else {
    const lvdist = p=>p.la.map(l=>l+' '+(p.lvc_a[l]||0)).join('、')||'—';
    const lvdistB = p=>p.lb.map(l=>l+' '+(p.lvc_b[l]||0)).join('、')||'—';
    h += '<div class="card">'+cardHd('层级变化进程（'+changed.length+'）','各层级出现轮数分布')
      +'<div class="tbl-wrap"><table><thead><tr><th>进程</th><th>A 层级出现分布</th><th>B 层级出现分布</th><th>标签</th></tr></thead><tbody>'
      + (changed.map(p=>'<tr><td class="name">'+procLink(p.name)+'</td><td>'+esc(lvdist(p))+'</td><td>'+esc(lvdistB(p))+'</td><td>'+procTags(p)+'</td></tr>').join('')
        || '<tr><td colspan="4" class="muted">无层级变化进程</td></tr>')
      +'</tbody></table></div></div>';
  }
  // 全量进程表
  h += '<div class="card">'+cardHd('全量进程表（'+list.length+'）',metric.toUpperCase()+' · 点击列头排序 · 点击进程进详情')
    +'<div class="controls"><input type="text" id="pkKw" placeholder="关键词，多个用逗号分隔" value="'+esc(state.pkKw)+'" style="width:240px">'
    +'<select id="pkLevel"><option value="">全部层级</option>'+m.levels.map(L=>'<option'+(state.pkLevel===L?' selected':'')+'>'+esc(L)+'</option>').join('')+'</select>'
    +'<select id="pkCat"><option value="">全部归类</option><option value="inhouse"'+(state.pkCat==='inhouse'?' selected':'')+'>自研</option><option value="google"'+(state.pkCat==='google'?' selected':'')+'>Google</option><option value="other"'+(state.pkCat==='other'?' selected':'')+'>其他</option></select>'
    +'<label><input type="checkbox" id="pkSigOnly"'+(state.pkSigOnly?' checked':'')+'> 仅显著</label>'
    +'<label><input type="checkbox" id="pkResident"'+(state.pkResident?' checked':'')+'> 仅常驻B</label>'
    +'<label><input type="checkbox" id="pkLeak"'+(state.pkLeak?' checked':'')+'> 仅泄漏</label>'
    +'<label>|GAP| ≥ <input type="number" id="pkGapMin" min="0" step="1" value="'+state.pkGapMin+'"> MB</label></div>'
    +'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>进程</th><th>层级 A</th><th>层级 B</th>'
    +'<th class="num sort" data-k="rate">出现率A/B</th>'
    +'<th class="num sort" data-k="mi">轮均 A</th><th class="num sort" data-k="mi">轮均 B</th>'
    +'<th class="num sort" data-k="p90">P90 A</th><th class="num sort" data-k="p90">P90 B</th>'
    +'<th class="num sort" data-k="max">最大A/B</th>'
    +'<th class="num sort" data-k="gap">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody id="pkBody"></tbody></table></div></div>';
  // 走势对比
  h += '<div class="card">'+cardHd('走势对比','默认 |GAP| Top5 · '+(AXIS==='round'?'x=轮次':'x=测试小时')+' · 实线=A 虚线=B')
    +'<div id="trPick"></div><div id="trChart" class="chart chart-tall"></div></div>';
  el.innerHTML = h;
  // Top20 bar
  const t20 = [...top20].sort((a,b)=>a.gap-b.gap);
  if (t20.length) makeChart(document.getElementById('topChart')).setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>{const p=t20[ps[0].dataIndex];return esc(p.name)+'<br>GAP '+fmt(p.gap)+' MB<br>A '+fmt(p.da.mi)+' / B '+fmt(p.db.mi);}},
    grid:{top:10,left:10,right:60,bottom:20,containLabel:true},
    xAxis:{type:'value',name:'MB'},
    yAxis:{type:'category',data:t20.map(p=>p.name),axisLabel:{fontSize:11,width:170,overflow:'truncate'}},
    series:[{type:'bar',data:t20.map(p=>({value:+p.gap.toFixed(2),itemStyle:{color:p.gap>0?'#f43f5e':'#10b981',borderRadius:p.gap>0?[0,4,4,0]:[4,0,0,4]}})),label:{show:true,position:'right',formatter:d=>fmt(d.value)}}]
  });
  const pkBody = document.getElementById('pkBody');
  const fillPk = ()=>{
    const kws = state.pkKw.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    let rows = list.filter(p=>{
      if (kws.length && !kws.some(k=>p.name.includes(k))) return false;
      if (state.pkLevel && !p.la.includes(state.pkLevel) && !p.lb.includes(state.pkLevel)) return false;
      if (state.pkCat==='inhouse' && !p.inhouse) return false;
      if (state.pkCat==='google' && !p.google) return false;
      if (state.pkCat==='other' && (p.inhouse||p.google)) return false;
      if (state.pkSigOnly && !p.sig) return false;
      if (state.pkResident && !p.resident_b) return false;
      if (state.pkLeak && !p.leak_a && !p.leak_b) return false;
      if (Math.abs(p.gap) < state.pkGapMin) return false;
      return true;
    });
    const k = state.pkSort, dir = state.pkDir;
    rows.sort((x,y)=>{
      const vx = k==='gap'? x.gap : k==='mi'? x.db.mi : k==='p90'? (x.db.p90??-1) : k==='max'? (x.db.max??-1) : x.db.rate;
      const vy = k==='gap'? y.gap : k==='mi'? y.db.mi : k==='p90'? (y.db.p90??-1) : k==='max'? (y.db.max??-1) : y.db.rate;
      return (vx-vy)*dir;
    });
    pkBody.innerHTML = rows.map(p=>'<tr><td class="name pname" title="'+esc(p.name)+'">'+procLink(p.name)+'</td>'
      +'<td class="lvcell" title="'+esc(p.la.join('、')||'—')+'">'+esc(p.la[0]||'—')+(p.la.length>1?' +'+(p.la.length-1):'')+'</td>'
      +'<td class="lvcell" title="'+esc(p.lb.join('、')||'—')+'">'+esc(p.lb[0]||'—')+(p.lb.length>1?' +'+(p.lb.length-1):'')+'</td>'
      +'<td class="num">'+Math.round(p.da.rate*100)+'%/'+Math.round(p.db.rate*100)+'%</td>'
      +'<td class="num">'+fmt(p.da.mi)+'</td><td class="num">'+fmt(p.db.mi)+'</td>'
      +'<td class="num">'+fmt(p.da.p90)+'</td><td class="num">'+fmt(p.db.p90)+'</td>'
      +'<td class="num">'+fmt(p.da.max)+' / '+fmt(p.db.max)+'</td>'
      + gapCells(p.da.mi, p.db.mi, p.gapt, p.gapp) + '<td>'+procTags(p)+'</td></tr>').join('')
      || '<tr><td colspan="12" class="muted">无匹配进程</td></tr>';
  };
  document.getElementById('pkKw').oninput = e=>{state.pkKw=e.target.value;fillPk();};
  document.getElementById('pkLevel').onchange = e=>{state.pkLevel=e.target.value;fillPk();};
  document.getElementById('pkCat').onchange = e=>{state.pkCat=e.target.value;fillPk();};
  document.getElementById('pkSigOnly').onchange = e=>{state.pkSigOnly=e.target.checked;fillPk();};
  document.getElementById('pkResident').onchange = e=>{state.pkResident=e.target.checked;fillPk();};
  document.getElementById('pkLeak').onchange = e=>{state.pkLeak=e.target.checked;fillPk();};
  document.getElementById('pkGapMin').oninput = e=>{state.pkGapMin=+e.target.value||0;fillPk();};
  el.querySelectorAll('th.sort').forEach(th=>{
    th.style.cursor='pointer';
    th.onclick = ()=>{ state.pkSort = th.dataset.k; state.pkDir = -state.pkDir; fillPk(); };
  });
  fillPk();
  // 走势对比
  if (!state.trSel) state.trSel = list.slice(0,5).map(p=>p.name);
  state.trSel = state.trSel.filter(n=>list.some(p=>p.name===n));
  const drawTr = ()=>{
    const series=[];
    state.trSel.forEach((name,idx)=>{
      const p = m.procs[name]; if(!p) return;
      const col = PROC_PALETTE[idx%PROC_PALETTE.length];
      series.push(lineSeries(name+'·A', 0, p.a, col, false));
      series.push(lineSeries(name+'·B', 1, p.b, col, true));
    });
    makeChart(document.getElementById('trChart')).setOption(tsOption(series));
  };
  multiPicker({el:document.getElementById('trPick'), options:list.map(p=>p.name), selected:state.trSel,
    colorOf:(n,idx)=>PROC_PALETTE[idx%PROC_PALETTE.length],
    onChange:sel=>{state.trSel=sel;drawTr();}, placeholder:'搜索添加进程…'});
  drawTr();
};

/* ============ 5/6. 自研 / Google 应用 ============ */
function renderCategory(key){
  const el = document.getElementById('page-'+key);
  const m = MV();
  const isIh = key==='inhouse';
  const cn = isIh?'自研':'Google';
  const rows = m.top.map(n=>m.procs[n]).filter(p=>isIh?p.inhouse:p.google);
  const nA = rows.filter(p=>p.da.k>0).length, nB = rows.filter(p=>p.db.k>0).length;
  const sumA = rows.reduce((s,p)=>s+p.da.mi,0), sumB = rows.reduce((s,p)=>s+p.db.mi,0);
  let h = RULE_NOTE;
  h += '<div class="grid-kpi auto" style="margin-bottom:16px">'
    + kpiCard(cn+'进程数', metric.toUpperCase(), nA, nB, '个', false, 0)
    + kpiCard(cn+' 轮均合计', metric.toUpperCase(), sumA, sumB, 'MB', false)
    +'</div>';
  h += '<div class="card">'+cardHd(cn+'进程明细','')+'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>进程</th>'+(isIh?'<th>判定</th>':'')+'<th>层级 A</th><th>层级 B</th><th class="num">出现率A/B</th>'
    +'<th class="num">轮均 A</th><th class="num">轮均 B</th><th class="num">值均 A</th><th class="num">值均 B</th>'
    +'<th class="num">GAP</th><th class="num">GAP%</th><th>标签</th></tr></thead><tbody>'
    + (rows.map(p=>'<tr><td class="name">'+procLink(p.name)+'</td>'
      +(isIh?'<td class="muted">'+(p.ih_src==='whitelist'?'白名单':'前缀')+'</td>':'')
      +'<td>'+esc(p.la.join('、')||'—')+'</td><td>'+esc(p.lb.join('、')||'—')+'</td>'
      +'<td class="num">'+Math.round(p.da.rate*100)+'%/'+Math.round(p.db.rate*100)+'%</td>'
      +'<td class="num">'+fmt(p.da.mi)+'</td><td class="num">'+fmt(p.db.mi)+'</td>'
      +'<td class="num">'+fmt(p.da.mean)+'</td><td class="num">'+fmt(p.db.mean)+'</td>'
      +gapCells(p.da.mi,p.db.mi,p.gapt,p.gapp)+'<td>'+procTags(p)+'</td></tr>').join('')
      || '<tr><td colspan="12" class="muted">无' + cn + '进程</td></tr>')
    +'</tbody></table></div></div>';
  el.innerHTML = h;
}

const _ES_CN = {mtk_mobilelog:'MTK mobilelog',mtk_debuglogger:'MTK debuglogger',unisoc_ylog:'展锐 ylog',bugreport:'bugreport（仅覆盖测试末段）'};
function evSrcLine(i){
  const es = (DS[i].event_source)||{}, ev = DATA.events[i?'b':'a'];
  const k = es.kind;
  if (!k || !(DS[i].events_total||es.events)) return '事件来源：无事件日志';
  let t = '事件来源：'+(_ES_CN[k]||k)+'（'+es.files+' 文件，过滤后 '+es.lines+' 行，事件 '+es.events+' 条'
    +(es.first?'，测试期覆盖 '+String(es.first).slice(0,16)+' ~ '+String(es.last).slice(0,16):'')+'）';
  if (DS[i].lmk_total!=null) t += '；lmkcnt 累计 '+DS[i].lmk_total+' 次 / killinfo 解析 '+ev.lmk.total+' 次';
  const evh=ev.ev_hours, ht=DS[i].hours_total;
  if (evh!=null && ht!=null && Math.abs(evh-ht)>0.05) t += '；LMK 频率按事件覆盖时长 '+evh.toFixed(1)+' h 计';
  return t;
}

    + eb.anr.map(e=>'<tr><td>B</td><td class="mono">'+esc(e.t)+'</td><td class="name">'+esc(e.proc)+'</td><td class="name">'+esc(e.reason)+'</td></tr>').join('')
      || '<tr><td colspan="4" class="muted">无</td></tr>')
    +'</tbody></table></div></div>'
    +'<div class="card">'+cardHd('crash（'+ea.crash.length+' / '+eb.crash.length+'）','')
    +'<div class="tbl-wrap h320"><table><thead><tr><th>侧</th><th>时间</th><th>进程</th><th>原因</th></tr></thead><tbody>'
    + (ea.crash.map(e=>'<tr><td>A</td><td class="mono">'+esc(e.t)+'</td><td class="name">'+esc(e.proc)+'</td><td class="name">'+esc(e.reason)+'</td></tr>').join('')
    + eb.crash.map(e=>'<tr><td>B</td><td class="mono">'+esc(e.t)+'</td><td class="name">'+esc(e.proc)+'</td><td class="name">'+esc(e.reason)+'</td></tr>').join('')
      || '<tr><td colspan="4" class="muted">无</td></tr>')
    +'</tbody></table></div></div></div>';
  const rbA = DS[0].reboots, rbB = DS[1].reboots;
  h += '<div class="card">'+cardHd('重启（'+rbA.length+' / '+rbB.length+'）','相邻有效轮 uptime 回退')
    +(rbA.length+rbB.length? '<ul class="findings">'
      + rbA.map(r=>'<li>A：第 '+r.after_round+' 轮 → 第 '+r.round+' 轮之间</li>').join('')
      + rbB.map(r=>'<li>B：第 '+r.after_round+' 轮 → 第 '+r.round+' 轮之间</li>').join('')+'</ul>'
      : '<div class="muted">未检测到重启</div>')+'</div>';
  el.innerHTML = h;
  // LMK 每小时分布（累计 | 每小时）
  const nh = Math.max(ea.lmk.hourly.length, eb.lmk.hourly.length);
  const cum = arr => { let s=0; return (arr||[]).map(v=>{s+=v;return s;}); };
  const drawLmk = cumMode => {
    if (cumMode){
      makeChart(document.getElementById('lmkChart')).setOption({
        tooltip:{trigger:'axis'}, legend:{top:0},
        grid:{top:36,left:50,right:20,bottom:30},
        xAxis:{type:'category',data:Array.from({length:nh},(_,i)=>i+'h'),name:'测试小时'},
        yAxis:{type:'value',name:'累计次'},
        series:[
          {name:'A '+LA,type:'line',data:cum(ea.lmk.hourly),itemStyle:{color:CA}},
          {name:'B '+LB,type:'line',data:cum(eb.lmk.hourly),itemStyle:{color:CB},lineStyle:{type:'dashed'}}]
      }, true);
    } else {
      makeChart(document.getElementById('lmkChart')).setOption({
        tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, legend:{top:0},
        grid:{top:36,left:50,right:20,bottom:30},
        xAxis:{type:'category',data:Array.from({length:nh},(_,i)=>i+'h'),name:'测试小时'},
        yAxis:{type:'value',name:'次'},
        series:[
          {name:'A '+LA,type:'bar',data:ea.lmk.hourly,itemStyle:{color:CA}},
          {name:'B '+LB,type:'bar',data:eb.lmk.hourly,itemStyle:{color:CB}}]
      }, true);
    }
  };
  drawLmk(true);
  document.getElementById('lmkSeg').querySelectorAll('.seg').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById('lmkSeg').querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b));
      drawLmk(b.dataset.v==='cum');
    };
  });
  // 启动原因分布
  const reasons = new Map();
  DS.forEach(d=>{ for (const r in (d.reason_counts||{})) reasons.set(r,(reasons.get(r)||0)+d.reason_counts[r]); });
  const rlist = [...reasons.keys()].sort((a,b)=>reasons.get(b)-reasons.get(a));
  makeChart(document.getElementById('evChart')).setOption({
    tooltip:{trigger:'axis'}, legend:{type:'scroll',top:0,icon:'roundRect'},
    grid:{top:36,left:50,right:20,bottom:30},
    xAxis:{type:'category',data:['A '+LA,'B '+LB]},
    yAxis:{type:'value',name:'次数'},
    series:rlist.map(r=>({name:r,type:'bar',stack:'s',barMaxWidth:90,itemStyle:{borderRadius:0},data:[(DS[0].reason_counts||{})[r]||0,(DS[1].reason_counts||{})[r]||0]}))
  });
  if (hasEv){
    const kw = document.getElementById('evKw'), evBody = document.getElementById('evBody'), wake = document.getElementById('wakePanel');
    const fill = ()=>{
      state.evQ = kw.value.trim();
      const k = state.evQ;
      let rows='';
      DS.forEach((d,i)=>d.events.forEach(e=>{
        if (k && !(e.proc||'').includes(k) && !(e.comp||'').includes(k) && !(e.caller||'').includes(k)) return;
        rows += '<tr'+(e.phase==='boot'?' class="phaseboot"':'')+'><td>'+(i?'B':'A')+'</td><td class="mono">'+esc(e.t.slice(5))+'</td><td>'+esc(e.phase)+'</td><td>'+esc(e.kind)+'</td><td class="name">'+esc(e.proc||'')+'</td><td>'+esc(e.reason||'')+'</td><td class="mono comp">'+esc(e.comp||'')+'</td><td>'+esc(e.caller||'')+'</td><td>'+esc(e.adj||'')+'</td></tr>';
      }));
      evBody.innerHTML = rows || '<tr><td colspan="9" class="muted">无匹配事件</td></tr>';
      if (!k){ wake.innerHTML='<div class="muted">输入进程关键词以查看唤醒链。</div>'; return; }
      const procs = new Set();
      DS.forEach(d=>d.events.forEach(e=>{ if(e.proc) procs.add(e.proc); if(e.caller) procs.add(e.caller); }));
      let target = procs.has(k) ? k : [...procs].find(p=>p.includes(k));
      if (!target){ wake.innerHTML='<div class="muted">未在事件中找到匹配进程。</div>'; return; }
      const box = i=>{
        const pulledBy = DS[i].events.filter(e=>e.kind==='start' && e.proc===target);
        const pulls = DS[i].events.filter(e=>e.kind==='start' && e.caller===target && e.proc!==target);
        const tag = e => e.phase==='boot' ? '（启动期）' : '';
        const chip = '<span class="sc sc-'+(i?'b':'a')+'">'+(i?'B':'A')+'</span>';
        const li1 = pulledBy.map(e=>'<li><b>'+esc(e.caller||'(未知)')+'</b> · '+esc(e.reason||'')+' · '+esc(e.t.slice(5))+tag(e)+'</li>').join('')||'<li class="muted">无</li>';
        const li2 = pulls.map(e=>'<li><b>'+esc(e.proc)+'</b> · '+esc(e.reason||'')+' · '+esc(e.t.slice(5))+tag(e)+'</li>').join('')||'<li class="muted">无</li>';
        return '<div class="box"><h5>'+chip+'被谁拉起</h5><ul>'+li1+'</ul></div>'
          +'<span class="warr">→</span>'
          +'<div class="mid">'+chip+esc(target)+'</div>'
          +'<span class="warr">→</span>'
          +'<div class="box"><h5>'+chip+'拉起了谁</h5><ul>'+li2+'</ul></div>';
      };
      wake.innerHTML = '<div class="wake">'+box(0)+'</div><div class="wake" style="margin-top:14px">'+box(1)+'</div>';
    };
    kw.oninput = fill; fill();
  }
};

/* ============ 8. 内存压力 ============ */
RENDER.pressure = function(){
  const el = document.getElementById('page-pressure');
  const cs = DATA.pressure.counters;
  if (!cs.length){
    el.innerHTML = '<div class="card"><div class="empty">本测试包无 proc_vmstat 数据</div></div>';
    return;
  }
  if (!state.psSel) state.psSel = cs.length? [cs[0].name] : [];
  state.psSel = state.psSel.filter(n=>cs.some(c=>c.name===n));
  const pf = v => v==null ? '—' : (Math.abs(v)>=1000 ? fmt0(v) : fmt(v));
  let h = '<div class="card">'+cardHd('内存压力计数器','proc_vmstat 每轮增量汇总 · /小时 = 总量/覆盖小时')
    +'<div class="tbl-wrap"><table><thead><tr><th>计数器</th><th>单位</th>'
    +'<th class="num">A 总量</th><th class="num">A /小时</th><th class="num">A P90/轮</th>'
    +'<th class="num">B 总量</th><th class="num">B /小时</th><th class="num">B P90/轮</th>'
    +'<th class="num">GAP/h</th><th class="num">GAP%</th></tr></thead><tbody>';
  cs.forEach(c=>{
    h += '<tr><td>'+esc(c.name)+'</td><td class="muted">'+esc(c.unit)+'</td>'
      +'<td class="num">'+pf(c.sa&&c.sa.total)+'</td><td class="num">'+pf(c.sa&&c.sa.per_hour)+'</td><td class="num">'+pf(c.sa&&c.sa.p90)+'</td>'
      +'<td class="num">'+pf(c.sb&&c.sb.total)+'</td><td class="num">'+pf(c.sb&&c.sb.per_hour)+'</td><td class="num">'+pf(c.sb&&c.sb.p90)+'</td>'
      +'<td class="num">'+pf(c.gap)+'</td><td class="num">'+(c.gapp==null?'—':(c.gapp>0?'+':'')+c.gapp.toFixed(1)+'%')+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '<div class="card">'+cardHd('每轮增量时序',(AXIS==='round'?'x=轮次':'x=测试小时'),
      '<span class="segtrack" id="psSeg"><button class="seg active" data-v="cum">累计</button><button class="seg" data-v="delta">每轮增量</button></span>')
    +'<div id="psPick"></div><div class="sm-grid" id="psCharts"></div></div>';
  el.innerHTML = h;
  const cumDelta = arr => { let s=0; return (arr||[]).map(v=>{ if(v!=null) s+=v; return s; }); };
  const draw = cumMode => {
    const wrap = document.getElementById('psCharts');
    wrap.innerHTML = state.psSel.map((nm,idx)=>{
      const c = cs.find(x=>x.name===nm); if(!c) return '';
      return '<div><div class="sm-hd">'+esc(nm)+' <span class="muted">'+(cumMode?'累计':'增量/轮')+' '+esc(c.unit)+'</span></div>'
        +'<div class="sm-chart" id="psC'+idx+'"></div></div>';
    }).join('');
    const last = wrap.querySelectorAll('.sm-chart').length - 1;
    wrap.querySelectorAll('.sm-chart').forEach((cd,i)=>{
      const c = cs.find(x=>x.name===state.psSel[i]); if(!c) return;
      const sa = cumMode ? cumDelta(c.a) : c.a, sb = cumMode ? cumDelta(c.b) : c.b;
      const s = [];
      if (sa) s.push(lineSeries('A '+LA, 0, sa, CA, false));
      if (sb) s.push(lineSeries('B '+LB, 1, sb, CB, true));
      const o = tsOption(s, {yAxis:{type:'value',name:cumMode?'累计':'增量/轮'}});
      o.legend = {show:false};
      o.grid.bottom = 30;
      o.dataZoom = (i===last) ? [{type:'inside'},{type:'slider',height:18,bottom:8}] : [{type:'inside'}];
      const ch = makeChart(cd);
      ch.group = 'psGrp';
      ch.setOption(o);
    });
    echarts.connect('psGrp');
  };
  draw(true);
  document.getElementById('psSeg').querySelectorAll('.seg').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById('psSeg').querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b));
      draw(b.dataset.v==='cum');

  });
